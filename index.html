<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق بيم الرضوان لإدارة السوبر ماركت</title>
    <!-- مكتبة الباركود والتعرف البصري -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@v5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --success: #059669;
            --danger: #dc2626;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
        }
        header {
            background-color: var(--primary);
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 15px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            opacity: 0.9;
        }
        .btn-delete { background-color: var(--danger); }
        .btn-success { background-color: var(--success); }
        .item-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid var(--border);
            margin-top: 10px;
        }
        .item-img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <header>🛒 بيم الرضوان - إدارة المخزون والمبيعات</header>

    <div class="container">
        <h3>إضافة أو تعديل منتج</h3>
        <input type="hidden" id="editDocId">
        
        <div class="form-group">
            <label>اسم المنتج</label>
            <input type="text" id="productName" placeholder="أدخل اسم المنتج...">
        </div>

        <div class="form-group">
            <label>التصنيف</label>
            <input type="text" id="productCategory" placeholder="مثال: مواد غذائية، مناديل...">
        </div>

        <div class="form-group">
            <label>الباركود</label>
            <input type="text" id="productBarcode" placeholder="امسح أو أدخل الباركود...">
        </div>

        <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 1;">
                <label>عدد قطع الطرد (Bundle Qty)</label>
                <input type="number" id="bundleQty" oninput="calculateUnitFromBundle()">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>شراء الطرد الكامل (₺)</label>
                <input type="number" step="0.01" id="bundleBuy" oninput="calculateUnitFromBundle()">
            </div>
        </div>

        <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 1;">
                <label>شراء القطعة المفردة (₺)</label>
                <input type="number" step="0.01" id="singleBuy" oninput="calculateSingleProfit()">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>بيع القطعة المفردة (₺)</label>
                <input type="number" step="0.01" id="singleSell" oninput="calculateSingleProfit()">
            </div>
        </div>

        <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 1;">
                <label>بيع الطرد الكامل (₺) [يُحسب تلقائياً]</label>
                <input type="number" step="0.01" id="bundleSell" oninput="calculateBundleProfit()">
            </div>
        </div>

        <div id="bundleResultDisplay" style="font-weight: bold; margin-bottom: 10px;"></div>
        <div id="singleResultDisplay" style="font-weight: bold; margin-bottom: 15px;"></div>

        <div id="imagePreviewContainer" style="display:none; margin-bottom: 15px;">
            <img id="previewImg" class="item-img" style="width: 100px; height: 100px;">
        </div>

        <div class="form-group">
            <label>صورة المنتج (كاميرا أو معرض)</label>
            <input type="file" id="cameraCaptureInput" accept="image/*" capture="environment" style="margin-bottom: 5px;">
            <input type="file" id="galleryInput" accept="image/*">
        </div>

        <button id="saveBtn" onclick="saveProduct()">حفظ المنتج بالسحابة</button>
        <button type="button" onclick="clearForm()" style="background-color: var(--text-muted);">إفراغ الحقول</button>
    </div>

    <div class="container">
        <h3>قائمة المنتجات</h3>
        <input type="text" id="searchInput" placeholder="بحث عن منتج..." oninput="renderProducts()" style="margin-bottom: 15px;">
        <div id="productsContainer"></div>
    </div>

    <!-- نافذة OCR المنبثقة -->
    <div id="ocrModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center;">
        <div style="background:white; padding:20px; border-radius:8px; max-width:400px; width:100%;">
            <h4>نتائج استخراج النصوص (OCR)</h4>
            <div id="ocrWordsContainer" style="display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px;"></div>
            <textarea id="ocrEditableResult" style="width:100%; height:60px; margin-bottom:10px;"></textarea>
            <button onclick="confirmOcrSelection()">تأكيد واختيار</button>
            <button onclick="closeOcrModal()" class="btn-delete">إلغاء</button>
        </div>
    </div>

    <script>
        let processedProductImageUrl = '';
        window.products = [];
        window.currentInvoice = [];

        function handleImageProcessing(file) {
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(e) {
                processedProductImageUrl = e.target.result;
                let previewContainer = document.getElementById('imagePreviewContainer');
                let previewImg = document.getElementById('previewImg');
                previewImg.src = processedProductImageUrl;
                previewContainer.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        document.getElementById('cameraCaptureInput').addEventListener('change', function(e) {
            handleImageProcessing(e.target.files[0]);
        });

        document.getElementById('galleryInput').addEventListener('change', function(e) {
            handleImageProcessing(e.target.files[0]);
        });

        // دالة حساب سعر شراء القطعة وتحديث سعر بيع الطرد تلقائياً بناءً على عدد القطع
        function calculateUnitFromBundle() {
            let bQty = parseFloat(document.getElementById('bundleQty').value) || 0;
            let bBuy = parseFloat(document.getElementById('bundleBuy').value) || 0;
            if (bQty > 0 && bBuy > 0) {
                let sBuy = (bBuy / bQty).toFixed(2);
                document.getElementById('singleBuy').value = sBuy;
                calculateSingleProfit();
            }
            
            // حساب سعر بيع الطرد تلقائياً عند تغيير عدد القطع أو سعر بيع القطعة
            let sSell = parseFloat(document.getElementById('singleSell').value) || 0;
            if (bQty > 0 && sSell > 0) {
                let autoBundleSell = (sSell * bQty).toFixed(2);
                document.getElementById('bundleSell').value = autoBundleSell;
            }

            calculateBundleProfit();
        }

        function calculateBundleProfit() {
            let bBuy = parseFloat(document.getElementById('bundleBuy').value) || 0;
            let bSell = parseFloat(document.getElementById('bundleSell').value) || 0;
            let profit = bSell - bBuy;
            let display = document.getElementById('bundleResultDisplay');
            display.innerText = `ربح الطرد الكامل: ${profit.toFixed(2)} ₺`;
            display.style.color = profit >= 0 ? '#059669' : '#dc2626';
        }

        function calculateSingleProfit() {
            let sBuy = parseFloat(document.getElementById('singleBuy').value) || 0;
            let sSell = parseFloat(document.getElementById('singleSell').value) || 0;
            let profit = sSell - sBuy;
            let display = document.getElementById('singleResultDisplay');
            display.innerText = `ربح القطعة: ${profit.toFixed(2)} ₺`;
            display.style.color = profit >= 0 ? '#4f46e5' : '#dc2626';

            // الميزة المطلوبة: حساب سعر بيع الطرد تلقائياً فور تعديل سعر بيع القطعة المفردة وعدد قطع الطرد
            let bQty = parseFloat(document.getElementById('bundleQty').value) || 0;
            if (bQty > 0 && sSell > 0) {
                let autoBundleSell = (sSell * bQty).toFixed(2);
                document.getElementById('bundleSell').value = autoBundleSell;
                calculateBundleProfit();
            }
        }

        function saveProduct() {
            let editId = document.getElementById('editDocId').value;
            let name = document.getElementById('productName').value.trim();
            if (!name) {
                alert('الرجاء إدخال اسم المنتج!');
                return;
            }

            let productData = {
                id: editId || 'prod_' + Date.now(),
                name: name,
                category: document.getElementById('productCategory').value.trim() || 'عام',
                barcode: document.getElementById('productBarcode').value.trim(),
                singleBuy: parseFloat(document.getElementById('singleBuy').value) || 0,
                singleSell: parseFloat(document.getElementById('singleSell').value) || 0,
                singleProfit: (parseFloat(document.getElementById('singleSell').value) || 0) - (parseFloat(document.getElementById('singleBuy').value) || 0),
                bundleQty: parseInt(document.getElementById('bundleQty').value) || 0,
                bundleBuy: parseFloat(document.getElementById('bundleBuy').value) || 0,
                bundleSell: parseFloat(document.getElementById('bundleSell').value) || 0,
                bundleProfit: (parseFloat(document.getElementById('bundleSell').value) || 0) - (parseFloat(document.getElementById('bundleBuy').value) || 0),
                image: processedProductImageUrl || ''
            };

            let index = window.products.findIndex(p => p.id === productData.id);
            if (index >= 0) {
                window.products[index] = productData;
            } else {
                window.products.push(productData);
            }

            alert('✅ تم حفظ المنتج بنجاح!');
            clearForm();
            renderProducts();
        }

        window.saveProductToCloud = function(data, id) {
            // دالة ربط سحابية مخصصة لـ Firebase
        };

        function clearForm() {
            document.getElementById('editDocId').value = '';
            document.getElementById('productName').value = '';
            document.getElementById('productCategory').value = '';
            document.getElementById('productBarcode').value = '';
            document.getElementById('bundleQty').value = '';
            document.getElementById('bundleBuy').value = '';
            document.getElementById('bundleSell').value = '';
            document.getElementById('singleBuy').value = '';
            document.getElementById('singleSell').value = '';
            processedProductImageUrl = '';
            document.getElementById('imagePreviewContainer').style.display = 'none';
            document.getElementById('saveBtn').innerText = 'حفظ المنتج بالسحابة';
        }

        function renderProducts() {
            let container = document.getElementById('productsContainer');
            let query = document.getElementById('searchInput').value.trim().toLowerCase();

            let filtered = window.products.filter(p => {
                return p.name.toLowerCase().includes(query) ||
                       (p.category && p.category.toLowerCase().includes(query)) ||
                       (p.barcode && p.barcode.toLowerCase().includes(query));
            });

            if (filtered.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 20px;">لا توجد منتجات مطابقة للبحث.</p>';
                return;
            }

            let html = '';
            filtered.forEach(p => {
                let imgTag = p.image ? `<img src="${p.image}" class="item-img">` : `<div style="width:50px;height:50px;background:#ddd;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;">بدون</div>`;
                html += `
                    <div class="item-card">
                        <div style="display: flex; align-items: center; gap: 12px;">
                            ${imgTag}
                            <div>
                                <div style="font-weight: bold; font-size: 15px;">${p.name}</div>
                                <div style="font-size: 12px; color: var(--text-muted);">الباركود: ${p.barcode || 'لا يوجد'}</div>
                                <div style="font-size: 13px; color: var(--success); font-weight: 600; margin-top: 2px;">
                                    بيع مفرد: ${p.singleSell} ₺ (ربح: ${p.singleProfit || 0} ₺)
                                </div>
                            </div>
                        </div>
                        <div style="display: flex; gap: 6px;">
                            <button onclick="editProduct('${p.id}')">تعديل</button>
                            <button class="btn-delete" onclick="deleteProduct('${p.id}')">حذف</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function editProduct(id) {
            let p = window.products.find(item => item.id === id);
            if (!p) return;

            document.getElementById('editDocId').value = p.id;
            document.getElementById('productName').value = p.name || '';
            document.getElementById('productCategory').value = p.category || '';
            document.getElementById('productBarcode').value = p.barcode || '';
            document.getElementById('bundleQty').value = p.bundleQty || '';
            document.getElementById('bundleBuy').value = p.bundleBuy || '';
            document.getElementById('bundleSell').value = p.bundleSell || '';
            document.getElementById('singleBuy').value = p.singleBuy || '';
            document.getElementById('singleSell').value = p.singleSell || '';

            processedProductImageUrl = p.image || '';
            if (processedProductImageUrl) {
                document.getElementById('previewImg').src = processedProductImageUrl;
                document.getElementById('imagePreviewContainer').style.display = 'block';
            } else {
                document.getElementById('imagePreviewContainer').style.display = 'none';
            }

            document.getElementById('saveBtn').innerText = 'تحديث بيانات المنتج بالسحابة 💾';
        }

        function deleteProduct(id) {
            window.products = window.products.filter(p => p.id !== id);
            renderProducts();
        }

        function closeOcrModal() {
            document.getElementById('ocrModal').style.display = 'none';
        }
    </script>
</body>
</html>
