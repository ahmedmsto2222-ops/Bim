<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سوبر ماركت بيم الرضوان - إدارة الفواتير</title>
    <style>
        @page {
            size: A4;
            margin: 10mm;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #1f2937;
            background: #f3f4f6;
            margin: 0;
            padding: 20px;
            font-size: 11pt;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #4f46e5;
            padding-bottom: 10px;
        }
        .header h1 {
            margin: 0;
            color: #4f46e5;
            font-size: 20pt;
        }
        .header p {
            margin: 5px 0 0;
            color: #6b7280;
            font-size: 10pt;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            margin-bottom: 15px;
            gap: 10px;
        }
        .controls input[type="text"] {
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 10.5pt;
            flex: 1;
            min-width: 200px;
        }
        .btn {
            background-color: #4f46e5;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 10.5pt;
        }
        .btn:hover { opacity: 0.9; }
        .btn-success { background-color: #059669; }
        .btn-danger { background-color: #dc2626; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #d1d5db;
            padding: 8px 10px;
            text-align: center;
        }
        th {
            background-color: #4f46e5;
            color: white;
            font-weight: bold;
            font-size: 10.5pt;
        }
        td input {
            width: 90%;
            border: none;
            background: transparent;
            text-align: center;
            font-size: 11pt;
            font-family: inherit;
        }
        td input:focus {
            background: #eef2ff;
            outline: 1px solid #4f46e5;
            border-radius: 4px;
        }
        td:nth-child(2) input {
            text-align: right;
        }
        tr:nth-child(even) { background-color: #f9fafb; }
        .footer {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 10pt;
            color: #6b7280;
        }
        @media print {
            body { background: #ffffff; padding: 0; }
            .container { box-shadow: none; padding: 0; }
            .controls, .btn-danger, .action-col { display: none !important; }
            td input { border: none !important; background: transparent !important; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>سوبر ماركت بيم الرضوان</h1>
            <p>نظام إدارة الفواتير والمشتريات</p>
        </div>

        <div class="controls">
            <input type="text" id="searchInput" placeholder="ابحث عن منتج بالاسم..." oninput="filterTable()">
            <button class="btn btn-success" onclick="addRow()">➕ إضافة صف</button>
            <button class="btn" onclick="window.print()" style="background-color: #1f2937;">🖨️ طباعة الفاتورة</button>
        </div>

        <div style="overflow-x: auto;">
            <table id="invoiceTable">
                <thead>
                    <tr>
                        <th style="width: 6%;">الرقم</th>
                        <th style="width: 32%;">اسم المنتج / الوصف</th>
                        <th style="width: 12%;">الكمية</th>
                        <th style="width: 18%;">سعر الطرد (₺)</th>
                        <th style="width: 18%;">سعر القطعة (₺)</th>
                        <th class="action-col" style="width: 14%;">إجراء</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- البيانات مدرجة مسبقاً من صورتك بدقة -->
                </tbody>
            </table>
        </div>

        <div class="footer">
            <div>تاريخ الإصدار: 2026-09-09</div>
            <div>تم التنظيم بواسطة نظام بيم الرضوان</div>
        </div>
    </div>

    <script>
        let invoiceData = [
            { id: 1, name: "معارم معطرة صغيرة سائل", qty: 2, bundlePrice: 520.00 },
            { id: 2, name: "شامبو هيرابي 3 لتر 4 قطع", qty: 2, bundlePrice: 1290.00 },
            { id: 3, name: "بلسم هيرابي 3 لتر 4 قطع", qty: 1, bundlePrice: 645.00 },
            { id: 4, name: "حامو هيرابي 3 لتر 4 قطع", qty: 1, bundlePrice: 645.00 },
            { id: 5, name: "سنة البيرة الحبوب 800 مل 12 قطعة", qty: 1, bundlePrice: 400.00 },
            { id: 6, name: "حامو ملتان 15 قطعة", qty: 2, bundlePrice: 1550.00 },
            { id: 7, name: "طون التونسنا 24 قطعة", qty: 1, bundlePrice: 1385.00 },
            { id: 8, name: "القارة معكرونة، مكرونة، هامرية، هيمبرية 20 قطعة 500 غرام", qty: 1, bundlePrice: 475.00 },
            { id: 9, name: "كروصان 24/7 عدد 24 قطعة", qty: 1, bundlePrice: 160.00 },
            { id: 10, name: "واصل", qty: 1, bundlePrice: 260.00 },
            { id: 11, name: "فتاحاعات دولاب جر 50 قطعة", qty: 1, bundlePrice: 300.00 },
            { id: 12, name: "بودرة أطفال علبة هينس 12 قطعة", qty: 1, bundlePrice: 410.00 },
            { id: 13, name: "كاتشب 12 قطعة", qty: 1, bundlePrice: 2800.00 },
            { id: 14, name: "فاصوليا مقادة 900 غرام 12 قطعة", qty: 1, bundlePrice: 700.00 },
            { id: 15, name: "جبنة حمرا 100 قطعة", qty: 1, bundlePrice: 950.00 },
            { id: 16, name: "بذور دور 750 غرام 12 قطعة", qty: 1, bundlePrice: 5000.00 },
            { id: 17, name: "شاي احمدي 400 غرام 24 قطعة", qty: 24, bundlePrice: 198.75 },
            { id: 18, name: "شاي حورجة 400 غرام", qty: 16, bundlePrice: 100.00 },
            { id: 19, name: "مربى بور 400 غرام", qty: 2, bundlePrice: 4150.00 },
            { id: 20, name: "شاي نادي احمدي 900 غرام", qty: 1, bundlePrice: 100.00 },
            { id: 21, name: "ميم مكعب أصلي 6 قطع", qty: 1, bundlePrice: 480.00 },
            { id: 22, name: "شاي هاي بيست 900 غرام 20 قطعة", qty: 1, bundlePrice: 1875.00 },
            { id: 23, name: "حمص جيزل 12 غرام 900 قطعة", qty: 1, bundlePrice: 130.00 },
            { id: 24, name: "طون الهيل 48 قطعة", qty: 1, bundlePrice: 30.00 }
        ];

        function renderTable(dataToRender) {
            let tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            dataToRender.forEach((item) => {
                let unitPrice = item.qty > 0 ? (item.bundlePrice / item.qty).toFixed(2) : 0;
                
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.id}</td>
                    <td><input type="text" value="${item.name}" onchange="updateData(${item.id}, 'name', this.value)"></td>
                    <td><input type="number" value="${item.qty}" oninput="updateData(${item.id}, 'qty', this.value)"></td>
                    <td><input type="number" step="0.01" value="${item.bundlePrice}" oninput="updateData(${item.id}, 'bundlePrice', this.value)"></td>
                    <td id="unit_${item.id}" style="font-weight: 600; color: #059669;">${unitPrice} ₺</td>
                    <td class="action-col"><button class="btn btn-danger" style="padding: 4px 8px; font-size: 10px;" onclick="deleteRow(${item.id})">حذف</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateData(id, field, value) {
            let item = invoiceData.find(p => p.id === id);
            if (!item) return;

            if (field === 'name') item.name = value;
            else if (field === 'qty') item.qty = parseFloat(value) || 0;
            else if (field === 'bundlePrice') item.bundlePrice = parseFloat(value) || 0;

            let unitPrice = item.qty > 0 ? (item.bundlePrice / item.qty).toFixed(2) : 0;
            let unitElem = document.getElementById(`unit_${id}`);
            if(unitElem) unitElem.innerText = unitPrice + ' ₺';
        }

        function addRow() {
            let newId = invoiceData.length > 0 ? Math.max(...invoiceData.map(p => p.id)) + 1 : 1;
            invoiceData.push({ id: newId, name: "منتج جديد", qty: 1, bundlePrice: 0 });
            renderTable(invoiceData);
        }

        function deleteRow(id) {
            invoiceData = invoiceData.filter(p => p.id !== id);
            renderTable(invoiceData);
        }

        function filterTable() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = invoiceData.filter(item => item.name.toLowerCase().includes(query));
            renderTable(filtered);
        }

        renderTable(invoiceData);
    </script>
</body>
</html>
