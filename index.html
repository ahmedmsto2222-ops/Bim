            padding: 20px;
            font-size: 11pt;
        }
        .container {
            max-width: 1550px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #4f46e5;
            padding-bottom: 10px;
        }
        .header h1 {
            margin: 0;
            color: #4f46e5;
            font-size: 20pt;
        }
        .header p {
            margin: 5px 0 0;
            color: #6b7280;
            font-size: 10pt;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            gap: 10px;
            align-items: center;
        }
        .btn {
            background-color: #4f46e5;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 10.5pt;
        }
        .btn:hover { opacity: 0.9; }
        
        /* تخطيط الجداول المتجاورة (جنباً إلى جنب في نفس الصفحة) */
        .tables-wrapper {
            display: flex;
            gap: 20px;
            justify-content: space-between;
            overflow-x: auto;
        }
        .table-box {
            flex: 1;
            min-width: 48%;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            table-layout: fixed;
        }
        th, td {
            border: 1px solid #d1d5db;
            padding: 8px 6px;
            text-align: center;
        }
        th {
            background-color: #4f46e5;
            color: white;
            font-weight: bold;
            font-size: 9.5pt;
        }
        /* تخصيص أعمدة الجدول بدقة */
        .col-num { width: 7%; background-color: #f9fafb; font-weight: bold; }
        .col-name { width: 43%; text-align: right !important; padding-right: 10px !important; font-weight: 500; font-size: 9.5pt; }
        .col-empty { width: 16.66%; background-color: #ffffff; }

        td input {
            width: 95%;
            border: none;
            background: transparent;
            text-align: center;
            font-size: 10pt;
            font-family: inherit;
        }
        td input:focus {
            background: #eef2ff;
            outline: 1px solid #4f46e5;
            border-radius: 4px;
        }
        tr:nth-child(even) { background-color: #fcfcfc; }
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 10pt;
            color: #6b7280;
            border-top: 1px solid #e5e7eb;
            padding-top: 10px;
        }
    </style>
</head>

        <div class="tables-wrapper">

        function renderDualTables() {
            let leftBody = document.getElementById('leftTableBody');
            let rightBody = document.getElementById('rightTableBody');
            
            let midPoint = Math.ceil(productsList.length / 2);
            let leftProducts = productsList.slice(0, midPoint);
            let rightProducts = productsList.slice(midPoint);

            let leftHTML = '';
            leftProducts.forEach((prod, idx) => {
                leftHTML += `<tr>
                    <td class="col-num">${idx + 1}</td>
                    <td class="col-name">${prod}</td>
                    <td class="col-empty"><input type="text" placeholder=""></td>
                    <td class="col-empty"><input type="text" placeholder=""></td>
                    <td class="col-empty"><input type="text" placeholder=""></td>
                </tr>`;
            });
            leftBody.innerHTML = leftHTML;

            let rightHTML = '';
            rightProducts.forEach((prod, idx) => {
                let actualIndex = midPoint + idx + 1;
                rightHTML += `<tr>
                    <td class="col-num">${actualIndex}</td>
                    <td class="col-name">${prod}</td>
                    <td class="col-empty"><input type="text" placeholder=""></td>
                    <td class="col-empty"><input type="text" placeholder=""></td>
                    <td class="col-empty"><input type="text" placeholder=""></td>

            });
            rightBody.innerHTML = rightHTML;
        }
