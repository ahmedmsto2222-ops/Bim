<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سوبر ماركت بيم الرضوان - إدارة الفواتير والمخزون</title>
    <!-- مكتبة قراءة ملفات الإكسل برمجياً داخل المتصفح -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @page {
            size: A4;
            margin: 10mm;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #1f2937;
            background: #f3f4f6;
            margin: 0;
            padding: 20px;
            font-size: 11pt;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #4f46e5;
            padding-bottom: 10px;
        }
        .header h1 {
            margin: 0;
            color: #4f46e5;
            font-size: 20pt;
        }
        .header p {
            margin: 5px 0 0;
            color: #6b7280;
            font-size: 10pt;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            margin-bottom: 15px;
            gap: 10px;
            align-items: center;
        }
        .controls input[type="text"] {
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 10.5pt;
            flex: 1;
            min-width: 180px;
        }
        .btn {
            background-color: #4f46e5;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 10.5pt;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn:hover { opacity: 0.9; }
        .btn-success { background-color: #059669; }
        .btn-danger { background-color: #dc2626; }
        .btn-info { background-color: #0284c7; }
        .btn-purple { background-color: #7c3aed; }
        
        .upload-box {
            background: #eef2ff;
            border: 2px dashed #4f46e5;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
        }
        .upload-box label {
            cursor: pointer;
            color: #4f46e5;
            font-weight: bold;
        }
        .upload-box input {
            display: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #d1d5db;
            padding: 8px 10px;
            text-align: center;
        }
        th {
            background-color: #4f46e5;
            color: white;
            font-weight: bold;
            font-size: 10.5pt;
            position: relative;
        }
        th .del-col-btn {
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 9pt;
            cursor: pointer;
            margin-right: 8px;
        }
        td input {
            width: 90%;
            border: none;
            background: transparent;
            text-align: center;
            font-size: 11pt;
            font-family: inherit;
        }
        td input:focus {
            background: #eef2ff;
            outline: 1px solid #4f46e5;
            border-radius: 4px;
        }
        tr:nth-child(even) { background-color: #f9fafb; }
        .footer {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 10pt;
            color: #6b7280;
        }
        @media print {
            body { background: #ffffff; padding: 0; }
            .container { box-shadow: none; padding: 0; }
            .controls, .upload-box, .btn-danger, .btn-purple, .del-col-btn, .action-col { display: none !important; }
            td input { border: none !important; background: transparent !important; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>سوبر ماركت بيم الرضوان</h1>
            <p>نظام إدارة الفواتير والمخزون الداعم لملفات إكسل والأعمدة المخصصة</p>
        </div>

        <!-- صندوق رفع ملف الإكسل المدمج -->
        <div class="upload-box">
            <label for="excelFile">
                📁 <strong>اضغط هنا لرفع ملف إكسل (.xlsx) وتحديث المنتجات فوراً</strong>
            </label>
            <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" onchange="handleExcelUpload(event)">
        </div>

        <div class="controls">
            <input type="text" id="searchInput" placeholder="ابحث عن منتج بالاسم..." oninput="filterTable()">
            <button class="btn btn-success" onclick="addRow()">➕ إضافة منتج</button>
            <button class="btn btn-purple" onclick="addColumn()">➕ إضافة عمود</button>
            <button class="btn btn-info" onclick="exportToExcel()">📥 تصدير لإكسل</button>
            <button class="btn" onclick="window.print()" style="background-color: #1f2937;">🖨️ طباعة</button>
        </div>

        <div style="overflow-x: auto;">
            <table id="invoiceTable">
                <thead>
                    <tr id="tableHeaderRow">
                        <!-- سيتم بناء أعمدة الجدول ديناميكياً هنا -->
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- سيتم تعبئة البيانات هنا تلقائياً -->
                </tbody>
            </table>
        </div>

        <div class="footer">
            <div>حالة النظام: <span style="color: #059669; font-weight: bold;">جاهز ✅</span></div>
            <div>بيم الرضوان - 2026</div>
        </div>
    </div>

    <script>
        // الأعمدة الافتراضية
        let invoiceColumns = JSON.parse(localStorage.getItem('bim_invoice_cols')) || ["اسم المنتج", "الكمية", "سعر الطرد"];

        // البيانات الافتراضية الأولية مع الحقول الديناميكية (extraProps)
        const initialData = [
            { id: 1, name: "معارم معطرة صغيرة سائل", qty: 2, bundlePrice: 520.00 },
            { id: 2, name: "شامبو هيرابي 3 لتر 4 قطع", qty: 2, bundlePrice: 1290.00 },
            { id: 3, name: "بلسم هيرابي 3 لتر 4 قطع", qty: 1, bundlePrice: 645.00 },
            { id: 4, name: "حامو هيرابي 3 لتر 4 قطع", qty: 1, bundlePrice: 645.00 },
            { id: 5, name: "سنة البيرة الحبوب 800 مل 12 قطعة", qty: 1, bundlePrice: 400.00 },
            { id: 6, name: "حامو ملتان 15 قطعة", qty: 2, bundlePrice: 1550.00 },
            { id: 7, name: "طون التونسنا 24 قطعة", qty: 1, bundlePrice: 1385.00 },
            { id: 8, name: "القارة معكرونة، مكرونة، هامرية، هيمبرية 20 قطعة 500 غرام", qty: 1, bundlePrice: 475.00 },
            { id: 9, name: "كروصان 24/7 عدد 24 قطعة", qty: 1, bundlePrice: 160.00 },
            { id: 10, name: "واصل", qty: 1, bundlePrice: 260.00 },
            { id: 11, name: "فتاحاعات دولاب جر 50 قطعة", qty: 1, bundlePrice: 300.00 },
            { id: 12, name: "بودرة أطفال علبة هينس 12 قطعة", qty: 1, bundlePrice: 410.00 },
            { id: 13, name: "كاتشب 12 قطعة", qty: 1, bundlePrice: 2800.00 },
            { id: 14, name: "فاصوليا مقادة 900 غرام 12 قطعة", qty: 1, bundlePrice: 700.00 },
            { id: 15, name: "جبنة حمرا 100 قطعة", qty: 1, bundlePrice: 950.00 },
            { id: 16, name: "بذور دور 750 غرام 12 قطعة", qty: 1, bundlePrice: 5000.00 },
            { id: 17, name: "شاي احمدي 400 غرام 24 قطعة", qty: 24, bundlePrice: 198.75 },
            { id: 18, name: "شاي حورجة 400 غرام", qty: 16, bundlePrice: 100.00 },
            { id: 19, name: "مربى بور 400 غرام", qty: 2, bundlePrice: 4150.00 },
            { id: 20, name: "شاي نادي احمدי 900 غرام", qty: 1, bundlePrice: 100.00 },
            { id: 21, name: "ميم مكعب أصلي 6 قطع", qty: 1, bundlePrice: 480.00 },
            { id: 22, name: "شاي هاي بيست 900 غرام 20 قطعة", qty: 1, bundlePrice: 1875.00 },
            { id: 23, name: "حمص جيزل 12 غرام 900 قطعة", qty: 1, bundlePrice: 130.00 },
            { id: 24, name: "طون الهيل 48 قطعة", qty: 1, bundlePrice: 30.00 }
        ];

        let invoiceData = JSON.parse(localStorage.getItem('bim_invoice_data')) || initialData;

        function saveToStorage() {
            localStorage.setItem('bim_invoice_data', JSON.stringify(invoiceData));
            localStorage.setItem('bim_invoice_cols', JSON.stringify(invoiceColumns));
        }

        function renderTable(dataToRender) {
            let headerRow = document.getElementById('tableHeaderRow');
            let tbody = document.getElementById('tableBody');
            
            // 1. بناء الهيدر ديناميكياً
            let headerHTML = `<th style="width: 5%;">الرقم</th>`;
            invoiceColumns.forEach((colName, colIdx) => {
                let delBtn = colIdx >= 3 ? `<button class="del-col-btn" onclick="deleteColumn(${colIdx})" title="حذف العمود">×</button>` : '';
                headerHTML += `<th>${colName} ${delBtn}</th>`;
            });
            headerHTML += `<th style="width: 10%;" class="action-col">إجراء</th>`;
            headerRow.innerHTML = headerHTML;

            // 2. بناء محتوى الجدول ديناميكياً
            tbody.innerHTML = '';
            dataToRender.forEach((item, index) => {
                let tr = document.createElement('tr');
                
                let rowHTML = `<td>${index + 1}</td>`;
                
                // الأعمدة الأساسية الثلاثة الثابتة
                let unitPrice = item.qty > 0 ? (item.bundlePrice / item.qty).toFixed(2) : 0;
                
                invoiceColumns.forEach((col, cIdx) => {
                    if (cIdx === 0) {
                        rowHTML += `<td><input type="text" value="${item.name || ''}" onchange="updateData(${item.id}, 'name', this.value)"></td>`;
                    } else if (cIdx === 1) {
                        rowHTML += `<td><input type="number" value="${item.qty !== undefined ? item.qty : 1}" oninput="updateData(${item.id}, 'qty', this.value)"></td>`;
                    } else if (cIdx === 2) {
                        rowHTML += `<td><input type="number" step="0.01" value="${item.bundlePrice !== undefined ? item.bundlePrice : 0}" oninput="updateData(${item.id}, 'bundlePrice', this.value)"></td>`;
                    } else {
                        // الأعمدة المخصصة المضافة حديثاً
                        if(!item.extra) item.extra = {};
                        let val = item.extra[col] !== undefined ? item.extra[col] : '';
                        rowHTML += `<td><input type="text" value="${val}" onchange="updateExtraData(${item.id}, '${col}', this.value)"></td>`;
                    }
                });

                // عمود سعر القطعة التلقائي المحسوب
                // يمكن عرضه أو تركه كجزء من الأعمدة، هنا سنبقي حساب سعر القطعة كعمود افتراضي رابع إن أردت أو نتركه يتأثر بالأعمدة
                rowHTML += `<td class="action-col"><button class="btn btn-danger" style="padding: 4px 8px; font-size: 10px;" onclick="deleteRow(${item.id})">حذف</button></td>`;
                
                tr.innerHTML = rowHTML;
                tbody.appendChild(tr);
            });
        }

        function updateData(id, field, value) {
            let item = invoiceData.find(p => p.id === id);
            if (!item) return;

            if (field === 'name') item.name = value;
            else if (field === 'qty') item.qty = parseFloat(value) || 0;
            else if (field === 'bundlePrice') item.bundlePrice = parseFloat(value) || 0;

            saveToStorage();
        }

        function updateExtraData(id, colName, value) {
            let item = invoiceData.find(p => p.id === id);
            if (!item) return;
            if (!item.extra) item.extra = {};
            item.extra[colName] = value;
            saveToStorage();
        }

        function addColumn() {
            let colName = prompt("أدخل اسم العمود الجديد (مثال: الملاحظات، المورد، التاريخ):");
            if (!colName || colName.trim() === "") return;
            
            if (invoiceColumns.includes(colName.trim())) {
                alert("هذا العمود موجود مسبقاً!");
                return;
            }

            invoiceColumns.push(colName.trim());
            saveToStorage();
            renderTable(invoiceData);
        }

        function deleteColumn(colIdx) {
            if (colIdx < 3) return; // منع حذف الأعمدة الأساسية
            let colName = invoiceColumns[colIdx];
            if (confirm(`هل أنت متكد من حذف العمود "${colName}"؟`)) {
                invoiceColumns.splice(colIdx, 1);
                saveToStorage();
                renderTable(invoiceData);
            }
        }

        function handleExcelUpload(event) {
            let file = event.target.files[0];
            if (!file) return;

            let reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let data = new Uint8Array(e.target.result);
                    let workbook = XLSX.read(data, { type: 'array' });
                    let firstSheetName = workbook.SheetNames[0];
                    let worksheet = workbook.Sheets[firstSheetName];
                    let jsonSheet = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    if (jsonSheet.length > 0) {
                        let headerRow = jsonSheet[0];
                        // تحديث أعمدة الملف المرفوع إذا لزم الأمر
                        for(let c = 3; c < headerRow.length; c++) {
                            if(headerRow[c] && !invoiceColumns.includes(headerRow[c])) {
                                invoiceColumns.push(headerRow[c]);
                            }
                        }

                        let newItems = [];
                        for (let i = 1; i < jsonSheet.length; i++) {
                            let row = jsonSheet[i];
                            if (row && row[0]) {
                                let newItem = {
                                    id: Date.now() + i,
                                    name: String(row[0] || ''),
                                    qty: parseFloat(row[1]) || 1,
                                    bundlePrice: parseFloat(row[2]) || 0,
                                    extra: {}
                                };
                                for(let c = 3; c < invoiceColumns.length; c++) {
                                    newItem.extra[invoiceColumns[c]] = row[c] !== undefined ? row[c] : '';
                                }
                                newItems.push(newItem);
                            }
                        }

                        if (newItems.length > 0) {
                            invoiceData = invoiceData.concat(newItems);
                            saveToStorage();
                            renderTable(invoiceData);
                            alert("تم رفع الملف وإضافة الأعمدة والبيانات بنجاح! 🎉");
                        }
                    }
                } catch (err) {
                    alert("حدث خطأ أثناء قراءة ملف الإكسل.");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function addRow() {
            let newId = Date.now();
            let newItem = { id: newId, name: "منتج جديد", qty: 1, bundlePrice: 0, extra: {} };
            invoiceColumns.slice(3).forEach(col => { newItem.extra[col] = ''; });
            invoiceData.push(newItem);
            saveToStorage();
            renderTable(invoiceData);
        }

        function deleteRow(id) {
            invoiceData = invoiceData.filter(p => p.id !== id);
            saveToStorage();
            renderTable(invoiceData);
        }

        function exportToExcel() {
            let worksheetData = [[]];
            invoiceColumns.forEach(col => worksheetData[0].push(col));

            invoiceData.forEach(item => {
                let row = [item.name, item.qty, item.bundlePrice];
                invoiceColumns.slice(3).forEach(col => {
                    row.push(item.extra && item.extra[col] !== undefined ? item.extra[col] : '');
                });
                worksheetData.push(row);
            });

            let ws = XLSX.utils.aoa_to_sheet(worksheetData);
            let wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "الفاتورة");
            XLSX.writeFile(wb, "Bim_Al_Radwan_Export.xlsx");
        }

        function filterTable() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = invoiceData.filter(item => item.name.toLowerCase().includes(query));
            renderTable(filtered);
        }

        renderTable(invoiceData);
    </script>
</body>
</html>
