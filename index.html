<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سوبر ماركت بيم الرضوان - قائمة المنتجات والفراغات المزدوجة</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #1f2937;
            background: #f3f4f6;
            margin: 0;
            padding: 20px;
            font-size: 11pt;
        }
        .container {
            max-width: 1450px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #4f46e5;
            padding-bottom: 10px;
        }
        .header h1 {
            margin: 0;
            color: #4f46e5;
            font-size: 20pt;
        }
        .header p {
            margin: 5px 0 0;
            color: #6b7280;
            font-size: 10pt;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            gap: 10px;
            align-items: center;
        }
        .btn {
            background-color: #4f46e5;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 10.5pt;
        }
        .btn:hover { opacity: 0.9; }
        
        /* تخطيط الجداول المتجاورة (جنباً إلى جنب في نفس الصفحة) */
        .tables-wrapper {
            display: flex;
            gap: 20px;
            justify-content: space-between;
            overflow-x: auto;
        }
        .table-box {
            flex: 1;
            min-width: 48%;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            table-layout: fixed;
        }
        th, td {
            border: 1px solid #d1d5db;
            padding: 10px 8px;
            text-align: center;
        }
        th {
            background-color: #4f46e5;
            color: white;
            font-weight: bold;
            font-size: 10pt;
        }
        /* تخصيص أعمدة الجدول */
        .col-num { width: 8%; background-color: #f9fafb; font-weight: bold; }
        .col-name { width: 52%; text-align: right !important; padding-right: 12px !important; font-weight: 500; }
        .col-empty-1 { width: 20%; background-color: #ffffff; }
        .col-empty-2 { width: 20%; background-color: #ffffff; }

        td input {
            width: 95%;
            border: none;
            background: transparent;
            text-align: center;
            font-size: 10.5pt;
            font-family: inherit;
        }
        td input:focus {
            background: #eef2ff;
            outline: 1px solid #4f46e5;
            border-radius: 4px;
        }
        tr:nth-child(even) { background-color: #fcfcfc; }
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 10pt;
            color: #6b7280;
            border-top: 1px solid #e5e7eb;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>سوبر ماركت بيم الرضوان</h1>
            <p>قائمة المنتجات مع الأعمدة الفارغة المتكررة جنباً إلى جنب</p>
        </div>

        <div class="controls">
            <div>
                <span style="font-weight: bold; color: #059669;">الحالة: جاهز للإدخال والطباعة ✅</span>
            </div>
            <button class="btn" onclick="window.print()" style="background-color: #1f2937;">🖨️ طباعة الصفحة</button>
        </div>

        <!-- حاوية الجداول المتجاورة (جدولان بنفس الصفحة) -->
        <div class="tables-wrapper">
            <!-- الجدول الأول (القسم الأيمن) -->
            <div class="table-box">
                <table>
                    <thead>
                        <tr>
                            <th class="col-num">رقم</th>
                            <th class="col-name">اسم المنتج</th>
                            <th class="col-empty-1"></th>
                            <th class="col-empty-2"></th>
                        </tr>
                    </thead>
                    <tbody id="leftTableBody">
                        <!-- يتم تعبئته برمجياً -->
                    </tbody>
                </table>
            </div>

            <!-- الجدول الثاني (القسم الأيسر - تكرار بنفس الفكرة) -->
            <div class="table-box">
                <table>
                    <thead>
                        <tr>
                            <th class="col-num">رقم</th>
                            <th class="col-name">اسم المنتج</th>
                            <th class="col-empty-1"></th>
                            <th class="col-empty-2"></th>
                        </tr>
                    </thead>
                    <tbody id="rightTableBody">
                        <!-- يتم تعبئته برمجياً -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="footer">
            بيم الرضوان - 2026 جميع الحقوق محفوظة
        </div>
    </div>

    <script>
        const productsList = [
            "زيت بيزجا 1.800 لتر 6 قطع Bizce yağ",
            "سمنة فيتا 2 لتر 6 قطع vita margarin",
            "سمنة 111 سطل 4 لتر 4 قطع",
            "رز أوريجنال 900 غرام 20 قطعة",
            "رز مكسر مغلف 900 غرام 12اد kırık pirinç",
            "طون التونسا 24 قطعة",
            "دبس رمان اكلا بورجيك 12 قطعة",
            "كاتشب 12 قطعة",
            "ملح طعام 750 غرام 30 قطعة",
            "لوبيا معكرونة + شعيرية 500 غرام",
            "انقرة معكرونة، أشكال، شعيرية 20ad",
            "سمنة الخير 4.5 لتر 4 قطع",
            "سمنة ايفيت 5 لتر 4 قطع",
            "رز بيك بن حبة طويلة 900 غرام 20قطعة",
            "رز كبسة 900 غرام 12 قطعة",
            "طون نايس 48 قطعة",
            "سردين صيني 50 قطعة",
            "مايونيز 12 قطعة Mayonez",
            "برغل مغلف 900 غرام 12 قطعة",
            "ملح 8 كغ tuz 8kg",
            "انقرة معكرونة طويلة 20ad",
            "خل التفاح اسما 750 مل 12 قطعة",
            "ماجي كف هارموني 60 قطعة",
            "محارم اطلس نص كيلو 10 قطع",
            "حفاضات غيرمو 5 قطع gizmo bez",
            "منة خضرا خارطة 20 قطعة",
            "فراش اسنان ديناميك 12 قطعة",
            "جاك كبيرة 24 قطعة Jak wresttir",
            "حليب دانيتو نكهات 27 قطعة",
            "جاست باور النمر 1 لتر 12 قطعة",
            "عصير التونسا ظرف 24 قطعة",
            "بلسم هوبي صغيرة 12 قطعة",
            "شامبو الهيدور 6 قطع",
            "ملوخية مصرية 12 قطعة 350 غرام",
            "دبس عنب 1350غ 12ق",
            "فانيليا و خميرة ريم 6 قطعة",
            "محارم معطرة سيل سيل 12adet",
            "حفاضات شوكا 5 قطع suka bez",
            "محارم معطرة جنى 90 منديل",
            "بخاخ حشرات كيلتوكس 12 قطعة",
            "دلة هال 12 قطعة",
            "ماء مشكل",
            "جاست باور النمر كبيرة 24 قطعة"
        ];

        function renderDualTables() {
            let leftBody = document.getElementById('leftTableBody');
            let rightBody = document.getElementById('rightTableBody');
            
            let midPoint = Math.ceil(productsList.length / 2);
            let leftProducts = productsList.slice(0, midPoint);
            let rightProducts = productsList.slice(midPoint);

            let leftHTML = '';
            leftProducts.forEach((prod, idx) => {
                leftHTML += `<tr>
                    <td class="col-num">${idx + 1}</td>
                    <td class="col-name">${prod}</td>
                    <td class="col-empty-1"><input type="text" placeholder=""></td>
                    <td class="col-empty-2"><input type="text" placeholder=""></td>
                </tr>`;
            });
            leftBody.innerHTML = leftHTML;

            let rightHTML = '';
            rightProducts.forEach((prod, idx) => {
                let actualIndex = midPoint + idx + 1;
                rightHTML += `<tr>
                    <td class="col-num">${actualIndex}</td>
                    <td class="col-name">${prod}</td>
                    <td class="col-empty-1"><input type="text" placeholder=""></td>
                    <td class="col-empty-2"><input type="text" placeholder=""></td>
                </tr>`;
            });
            rightBody.innerHTML = rightHTML;
        }

        renderDualTables();
    </script>
</body>
</html>
