<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق بيم الرضوان (سحابي)</title>
    <!-- استيراد مكتبة قراءة الباركود المباشرة -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- استيراد مكتبة التعرف على النصوص من الصور OCR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.0.2/tesseract.min.js"></script>
    <!-- استيراد مكتبة إزالة الخلفية بالذكاء الاصطناعي -->
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/index.umd.js"></script>
    
    <!-- استيراد مكتبات Firebase (الإصدار 10 المتوافق مع الويب) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAaAgIgzvyN4BzF4bYlvpsK1QDAMQbNBGI",
            authDomain: "bim-c930c.firebaseapp.com",
            databaseURL: "https://bim-c930c-default-rtdb.firebaseio.com",
            projectId: "bim-c930c",
            storageBucket: "bim-c930c.firebasestorage.app",
            messagingSenderId: "1041227214123",
            appId: "1:1041227214123:web:53c7a6e0d58e106237e96e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.products = [];
        window.currentInvoice = [];
        window.html5QrCode = null;
        window.isScanningActive = false;
        window.targetInputField = null;
        window.isScanLocked = false;

        const productsRef = ref(db, 'supermarket_products');
        onValue(productsRef, (snapshot) => {
            const data = snapshot.val();
            window.products = [];
            if (data) {
                Object.keys(data).forEach(key => {
                    window.products.push({ id: key, ...data[key] });
                });
            }
            if (typeof renderProducts === 'function') renderProducts();
        });

        window.saveProductToCloud = function(productData, editId) {
            if (!editId) {
                const exactMatch = window.products.find(p => 
                    p.name.trim().toLowerCase() === productData.name.trim().toLowerCase() || 
                    (productData.barcode && p.barcode && p.barcode.trim() === productData.barcode.trim())
                );

                if (exactMatch) {
                    let confirmUpdate = confirm(`⚠️ هذا المنتج موجود مسبقاً في القائمة (${exactMatch.name})!\nهل تريد تحديث بياناته بدلاً من إنشاء منتج جديد؟`);
                    if (confirmUpdate) {
                        const itemRef = ref(db, 'supermarket_products/' + exactMatch.id);
                        update(itemRef, productData).then(() => {
                            alert('✅ تم تحديث بيانات المنتج الموجود مسبقاً بنجاح!');
                            clearForm();
                            switchTab('displayTab', document.querySelectorAll('.tab-btn')[3]);
                        }).catch(err => alert('خطأ في التحديث: ' + err.message));
                    }
                    return;
                }

                const newRef = push(productsRef);
                set(newRef, productData).then(() => {
                    alert('✅ تم حفظ المنتج ومشاركته مع شريكك بنجاح!');
                    clearForm();
                    switchTab('displayTab', document.querySelectorAll('.tab-btn')[3]);
                }).catch(err => alert('خطأ في الحفظ: ' + err.message));
            } else {
                const itemRef = ref(db, 'supermarket_products/' + editId);
                update(itemRef, productData).then(() => {
                    alert('✅ تم تعديل المنتج وتحديثه لدى شريكك بنجاح!');
                    clearForm();
                    switchTab('displayTab', document.querySelectorAll('.tab-btn')[3]);
                }).catch(err => alert('خطأ في التعديل: ' + err.message));
            }
        };

        window.saveBatchProductsToCloud = async function(batchList) {
            try {
                for (let prod of batchList) {
                    const newRef = push(productsRef);
                    await set(newRef, prod);
                }
                alert(`✅ تم حفظ ${batchList.length} منتجاً دفعة واحدة بنجاح في السحابة!`);
                window.quickBatchRows = [];
                renderQuickBatchTable();
                switchTab('displayTab', document.querySelectorAll('.tab-btn')[3]);
            } catch (err) {
                alert('خطأ أثناء الحفظ الجماعي: ' + err.message);
            }
        };

        window.deleteProductFromCloud = function(id) {
            if (confirm('هل أنت متأكد من حذف هذا المنتج من عند الجميع؟')) {
                const itemRef = ref(db, 'supermarket_products/' + id);
                remove(itemRef).then(() => {
                    alert('🗑️ تم الحذف بنجاح.');
                });
            }
        };
    </script>
    
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-gradient: linear-gradient(135deg, #8b5cf6, #6d28d9);
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            direction: rtl;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .app-title {
            text-align: center;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            font-size: 26px;
            font-weight: 800;
        }

        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
            flex-wrap: wrap;
        }

        .tab-btn {
            flex: 1;
            min-width: 85px;
            padding: 10px 4px;
            border: none;
            background: #e2e8f0;
            color: var(--text-main);
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            text-align: center;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            background-color: #fff;
        }

        .btn-main {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-camera {
            background-color: var(--primary);
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: block;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            border: none;
        }

        .result-box {
            background: #ede9fe;
            color: #5b21b6;
            padding: 10px;
            border-radius: 8px;
            margin-top: 6px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
        }

        .section-box {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .section-title {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 16px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        .category-section {
            margin-top: 20px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .category-header {
            background: #f1f5f9;
            padding: 10px 15px;
            font-weight: bold;
            color: var(--primary);
            font-size: 16px;
            border-bottom: 1px solid var(--border);
        }

        .item-card {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-img {
            width: 55px;
            height: 55px;
            object-fit: contain;
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid var(--border);
            padding: 2px;
        }

        .no-img {
            width: 55px;
            height: 55px;
            background: #ffffff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        button.btn-edit { background-color: var(--warning); color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
        button.btn-delete { background-color: var(--danger); color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; }

        .invoice-total-card {
            background: var(--primary-gradient);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
        }
        .invoice-total-card h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
            opacity: 0.9;
        }
        .invoice-total-card .total-amount {
            font-size: 32px;
            font-weight: bold;
        }
        .invoice-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 12px 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .batch-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }
        .batch-table th, .batch-table td {
            border: 1px solid var(--border);
            padding: 6px;
            text-align: center;
            font-size: 12px;
        }
        .batch-table th {
            background: #f1f5f9;
            color: var(--primary);
        }
        .batch-table input {
            padding: 6px;
            font-size: 12px;
        }

        #ocrModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .ocr-modal-content {
            background: #fff;
            width: 90%;
            max-width: 500px;
            padding: 20px;
            border-radius: 12px;
            max-height: 90vh;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="app-title">بيم الرضوان 🛒</h2>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('posTab', this)">🛒 الكاشير</button>
        <button class="tab-btn" onclick="switchTab('quickBatchTab', this)">⚡ الجدول السريع</button>
        <button class="tab-btn" onclick="switchTab('addUnifiedTab', this)">➕ إضافة مفردة</button>
        <button class="tab-btn" onclick="switchTab('displayTab', this)">📋 المنتجات</button>
    </div>

    <!-- 1. قسم الكاشير والفاتورة -->
    <div id="posTab" class="tab-content active">
        <div class="invoice-total-card">
            <h3>إجمالي الفاتورة المطلوب دفعه</h3>
            <div class="total-amount" id="invoiceTotal">0.00 ₺</div>
        </div>

        <div class="form-group">
            <button type="button" id="scannerToggleBtn" class="btn-camera" style="background-color: var(--success); font-size: 18px; padding
