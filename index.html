            color: #1f2937;
            background: #f3f4f6;
            margin: 0;
            padding: 20px;
            font-size: 11pt;
        }
        .container {
            max-width: 1550px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #4f46e5;
            padding-bottom: 10px;
        }
        .header h1 {
            margin: 0;
            color: #4f46e5;
            font-size: 20pt;
        }
        .header p {
            margin: 5px 0 0;
            color: #6b7280;
            font-size: 10pt;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            gap: 10px;
            align-items: center;
        }
        .btn {
            background-color: #4f46e5;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 10.5pt;
        }
        .btn:hover { opacity: 0.9; }
        
        /* تنسيق الصفحات عند الطباعة والعرض */
        .page-sheet {
            display: flex;
            gap: 20px;
            justify-content: space-between;
            margin-bottom: 40px;
            background: #fff;
            padding: 15px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
        }
        .table-box {
            flex: 1;
            min-width: 48%;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        th, td {
            border: 1px solid #d1d5db;
            padding: 6px 4px;
            text-align: center;
            height: 28px; /* توحيد ارتفاع الصفوف لضمان التناسق */
        }
        th {
            background-color: #4f46e5;
            color: white;
            font-weight: bold;
            font-size: 9.5pt;
        }
        /* تخصيص أعمدة الجدول بدقة */
        .col-num { width: 7%; background-color: #f9fafb; font-weight: bold; font-size: 9pt; }
        .col-name { width: 43%; text-align: right !important; padding-right: 8px !important; font-weight: 500; font-size: 9pt; }
        .col-empty { width: 16.66%; background-color: #ffffff; }

        td input {
            width: 95%;
            border: none;
            background: transparent;
            text-align: center;
            font-size: 9.5pt;
            font-family: inherit;
        }
        td input:focus {
            background: #eef2ff;
            outline: 1px solid #4f46e5;
            border-radius: 4px;
        }
        tr:nth-child(even) { background-color: #fcfcfc; }
        
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 10pt;
            color: #6b7280;
            border-top: 1px solid #e5e7eb;
            padding-top: 10px;
        }

        /* إعدادات الطباعة لقطع كل صفحة بشكل صحيح ومستقل */
        @media print {
            body { background: none; padding: 0; }
            .container { box-shadow: none; padding: 0; max-width: 100%; }
            .controls, .footer, .header { display: none; }
            .page-sheet {
                page-break-after: always;
                break-after: page;
                border: none;
                padding: 0;
                margin: 0;
            }
        }
    </style>
</head>

        function generatePagedTables() {
            const container = document.getElementById('sheetsContainer');
            container.innerHTML = '';

            // كل صفحة تحتوي على جدولين (اليمين 20، واليسار 20 = إجمالي 40 منتج لكل صفحة)
            const itemsPerSheet = 40;
            const itemsPerTable = 20;

            for (let i = 0; i < productsList.length; i += itemsPerSheet) {
                let sheetDiv = document.createElement('div');
                sheetDiv.className = 'page-sheet';

                // بيانات الجدول الأيمن (أول 20 عنصراً في الصفحة)
                let rightProducts = productsList.slice(i, i + itemsPerTable);
                // بيانات الجدول الأيسر (العشرين عنصراً التالية في نفس الصفحة)
                let leftProducts = productsList.slice(i + itemsPerTable, i + itemsPerSheet);

                // بناء الجدول الأيمن
                let rightHTML = `<div class="table-box"><table><thead><tr>
                    <th class="col-num">رقم</th>
                    <th class="col-name">اسم المنتج</th>
                    <th class="col-empty"></th>
                    <th class="col-empty"></th>
                    <th class="col-empty"></th>
                </tr></thead><tbody>`;

                rightProducts.forEach((prod, idx) => {
                    let serialNum = i + idx + 1;
                    rightHTML += `<tr>
                        <td class="col-num">${serialNum}</td>
                        <td class="col-name">${prod}</td>
                        <td class="col-empty"><input type="text"></td>
                        <td class="col-empty"><input type="text"></td>
                        <td class="col-empty"><input type="text"></td>
                    </tr>`;
                });
                // إذا كانت المنتجات أقل من 20 في الجدول الأيمن، نكمل الأسطر فارغة للحفاظ على التنسيق
                for (let r = rightProducts.length; r < itemsPerTable; r++) {
                    let serialNum = i + r + 1;
                    rightHTML += `<tr>
                        <td class="col-num">${serialNum}</td>
                        <td class="col-name"></td>
                        <td class="col-empty"><input type="text"></td>
                        <td class="col-empty"><input type="text"></td>
                        <td class="col-empty"><input type="text"></td>
                    </tr>`;
                }
                rightHTML += `</tbody></table></div>`;

                // بناء الجدول الأيسر
                let leftHTML = `<div class="table-box"><table><thead><tr>
                    <th class="col-num">رقم</th>
                    <th class="col-name">اسم المنتج</th>
                    <th class="col-empty"></th>
                    <th class="col-empty"></th>
                    <th class="col-empty"></th>
                </tr></thead><tbody>`;

                leftProducts.forEach((prod, idx) => {
                    let serialNum = i + itemsPerTable + idx + 1;
                    leftHTML += `<tr>
                        <td class="col-num">${serialNum}</td>
                        <td class="col-name">${prod}</td>
                        <td class="col-empty"><input type="text"></td>
                        <td class="col-empty"><input type="text"></td>
                        <td class="col-empty"><input type="text"></td>
                    </tr>`;
                });
                // تكملة الأسطر الفارغة للجدول الأيسر إن وجدت
                for (let l = leftProducts.length; l < itemsPerTable; l++) {
                    let serialNum = i + itemsPerTable + l + 1;
                    leftHTML += `<tr>
                        <td class="col-num">${serialNum <= productsList.length ? serialNum : ''}</td>
                        <td class="col-name"></td>
                        <td class="col-empty"><input type="text"></td>
                        <td class="col-empty"><input type="text"></td>
                        <td class="col-empty"><input type="text"></td>
                    </tr>`;
                }
                leftHTML += `</tbody></table></div>`;

                sheetDiv.innerHTML = rightHTML + leftHTML;
                container.appendChild(sheetDiv);
            }
        }

        generatePagedTables();
