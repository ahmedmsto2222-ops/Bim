<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سوبر ماركت بيم الرضوان - إدارة الفواتير والمخزون</title>
    <!-- مكتبة قراءة ملفات الإكسل برمجياً -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- مكتبة قراءة ملفات PDF محلياً -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #1f2937;
            background: #f3f4f6;
            margin: 0;
            padding: 20px;
            font-size: 11pt;
        }
        .container {
            max-width: 1250px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #4f46e5;
            padding-bottom: 10px;
        }
        .header h1 {
            margin: 0;
            color: #4f46e5;
            font-size: 20pt;
        }
        .header p {
            margin: 5px 0 0;
            color: #6b7280;
            font-size: 10pt;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            margin-bottom: 15px;
            gap: 10px;
            align-items: center;
        }
        .controls input[type="text"] {
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 10.5pt;
            flex: 1;
            min-width: 180px;
        }
        .btn {
            background-color: #4f46e5;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 10.5pt;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn:hover { opacity: 0.9; }
        .btn-success { background-color: #059669; }
        .btn-danger { background-color: #dc2626; }
        .btn-info { background-color: #0284c7; }
        .btn-purple { background-color: #7c3aed; }
        
        .upload-boxes {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .upload-box {
            background: #eef2ff;
            border: 2px dashed #4f46e5;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            flex: 1;
            min-width: 220px;
        }
        .upload-box-pdf {
            background: #fef2f2;
            border: 2px dashed #b91c1c;
        }
        .upload-box label {
            cursor: pointer;
            font-weight: bold;
        }
        .upload-box input { display: none; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #d1d5db;
            padding: 8px 6px;
            text-align: center;
        }
        th {
            background-color: #4f46e5;
            color: white;
            font-weight: bold;
            font-size: 10pt;
        }
        td input {
            width: 95%;
            border: none;
            background: transparent;
            text-align: center;
            font-size: 10.5pt;
            font-family: inherit;
        }
        td input:focus {
            background: #eef2ff;
            outline: 1px solid #4f46e5;
            border-radius: 4px;
        }
        tr:nth-child(even) { background-color: #f9fafb; }
        .footer {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 10pt;
            color: #6b7280;
        }
        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 9999;
            color: white;
            font-size: 16pt;
            text-align: center;
            padding-top: 20vh;
        }
    </style>
</head>
<body>

    <div id="loadingOverlay">⏳ جاري قراءة جميع صفحات ملف الـ PDF بدقة وتحليل محتواه...<br><span id="progressText" style="font-size: 12pt; color: #fbbf24;">يرجى الانتظار...</span></div>

    <div class="container">
        <div class="header">
            <h1>سوبر ماركت بيم الرضوان</h1>
            <p>نظام إدارة الفواتير والمخزون - استخراج شامل لملفات الـ PDF</p>
        </div>

        <!-- صناديق الرفع -->
        <div class="upload-boxes">
            <div class="upload-box">
                <label for="excelFile">
                    📁 <strong>رفع ملف إكسل (.xlsx)</strong>
                </label>
                <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" onchange="handleExcelUpload(event)">
            </div>
            <div class="upload-box upload-box-pdf">
                <label for="pdfFile" style="color: #b91c1c;">
                    📄 <strong>رفع ملف PDF (استخراج شامل لكل المنتجات والأسعار)</strong>
                </label>
                <input type="file" id="pdfFile" accept=".pdf" onchange="handlePdfUpload(event)">
            </div>
        </div>

        <div class="controls">
            <input type="text" id="searchInput" placeholder="ابحث عن منتج بالاسم..." oninput="filterTable()">
            <button class="btn btn-success" onclick="addNewProductPrompt()">➕ إضافة منتج</button>
            <button class="btn btn-info" style="background-color: #d97706;" onclick="openPasteModal()">📋 إدخال النص يدوياً / مراجعة النصوص</button>
            <button class="btn btn-purple" onclick="addColumn()">➕ إضافة عمود</button>
            <button class="btn btn-info" onclick="exportToExcel()">📥 تصدير لإكسل</button>
            <button class="btn" onclick="window.print()" style="background-color: #1f2937;">🖨️ طباعة</button>
        </div>

        <div style="overflow-x: auto;">
            <table id="invoiceTable">
                <thead>
                    <tr id="tableHeaderRow"></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <div class="footer">
            <div>حالة النظام: <span style="color: #059669; font-weight: bold;">جاهز ✅</span></div>
            <div>بيم الرضوان - 2026</div>
        </div>
    </div>

    <script>
        let invoiceColumns = [
            "اسم المنتج", 
            "عدد القطع داخل الطرد", 
            "شراء الطرد", 
            "بيع الطرد", 
            "شراء القطعة", 
            "بيع القطعة"
        ];

        let invoiceData = [
            { id: 1, name: "معارم معطرة صغيرة سائل", pcs: 2, buyBundle: 520.00, sellBundle: 600.00, buyUnit: 260.00, sellUnit: 300.00, extra: {} },
            { id: 2, name: "شامبو هيرابي 3 لتر 4 قطع", pcs: 4, buyBundle: 1290.00, sellBundle: 1480.00, buyUnit: 322.50, sellUnit: 370.00, extra: {} }
        ];

        try {
            let savedCols = JSON.parse(localStorage.getItem('bim_invoice_cols_v11'));
            let savedData = JSON.parse(localStorage.getItem('bim_invoice_data_v11'));
            if(savedCols && savedCols.length >= 6) invoiceColumns = savedCols;
            if(savedData && savedData.length > 0) invoiceData = savedData;
        } catch(e) {}

        function saveToStorage() {
            localStorage.setItem('bim_invoice_data_v11', JSON.stringify(invoiceData));
            localStorage.setItem('bim_invoice_cols_v11', JSON.stringify(invoiceColumns));
        }

        function renderTable(dataToRender) {
            let headerRow = document.getElementById('tableHeaderRow');
            let tbody = document.getElementById('tableBody');
            
            let headerHTML = `<th style="width: 4%;">الرقم</th>`;
            invoiceColumns.forEach((colName, colIdx) => {
                let delBtn = colIdx >= 6 ? `<button class="del-col-btn" onclick="deleteColumn(${colIdx})" style="background: #ef4444; color: white; border: none; border-radius: 3px; padding: 1px 4px; font-size: 8pt; cursor: pointer; margin-right: 5px;">×</button>` : '';
                headerHTML += `<th>${colName} ${delBtn}</th>`;
            });
            headerHTML += `<th style="width: 8%;" class="action-col">إجراء</th>`;
            headerRow.innerHTML = headerHTML;

            tbody.innerHTML = '';
            dataToRender.forEach((item, index) => {
                let tr = document.createElement('tr');
                let rowHTML = `<td>${index + 1}</td>`;
                
                rowHTML += `<td><input type="text" value="${item.name || ''}" onchange="updateData(${item.id}, 'name', this.value)"></td>`;
                rowHTML += `<td><input type="number" id="pcs_${item.id}" value="${item.pcs !== undefined ? item.pcs : 1}" oninput="calculateAndUpdate(${item.id}, 'pcs')"></td>`;
                rowHTML += `<td><input type="number" step="0.01" id="buyBundle_${item.id}" value="${item.buyBundle !== undefined ? item.buyBundle : 0}" oninput="calculateAndUpdate(${item.id}, 'buyBundle')"></td>`;
                rowHTML += `<td><input type="number" step="0.01" id="sellBundle_${item.id}" value="${item.sellBundle !== undefined ? item.sellBundle : 0}" oninput="calculateAndUpdate(${item.id}, 'sellBundle')"></td>`;
                rowHTML += `<td><input type="number" step="0.01" id="buyUnit_${item.id}" value="${item.buyUnit !== undefined ? item.buyUnit : 0}" oninput="calculateAndUpdate(${item.id}, 'buyUnit')"></td>`;
                rowHTML += `<td><input type="number" step="0.01" id="sellUnit_${item.id}" value="${item.sellUnit !== undefined ? item.sellUnit : 0}" oninput="calculateAndUpdate(${item.id}, 'sellUnit')"></td>`;

                for(let c = 6; c < invoiceColumns.length; c++) {
                    let col = invoiceColumns[c];
                    if(!item.extra) item.extra = {};
                    let val = item.extra[col] !== undefined ? item.extra[col] : '';
                    rowHTML += `<td><input type="text" value="${val}" onchange="updateExtraData(${item.id}, '${col}', this.value)"></td>`;
                }

                rowHTML += `<td class="action-col"><button class="btn btn-danger" style="padding: 3px 6px; font-size: 10px;" onclick="deleteRow(${item.id})">حذف</button></td>`;
                tr.innerHTML = rowHTML;
                tbody.appendChild(tr);
            });
        }

        function updateData(id, field, value) {
            let trimmedVal = value.trim();
            if (field === 'name') {
                let existing = invoiceData.find(p => p.name.trim() === trimmedVal && p.id !== id);
                if (existing) {
                    alert("⚠️ اسم المنتج موجود مسبقاً في الجدول! لا يمكن تكرار نفس الاسم.");
                    renderTable(invoiceData);
                    return;
                }
            }
            let item = invoiceData.find(p => p.id === id);
            if (!item) return;
            item[field] = trimmedVal;
            saveToStorage();
        }

        function calculateAndUpdate(id, changedField) {
            let item = invoiceData.find(p => p.id === id);
            if (!item) return;

            let pcsVal = parseFloat(document.getElementById(`pcs_${id}`).value) || 1;
            let buyBundleVal = parseFloat(document.getElementById(`buyBundle_${id}`).value) || 0;
            let buyUnitVal = parseFloat(document.getElementById(`buyUnit_${id}`).value) || 0;
            let sellBundleVal = parseFloat(document.getElementById(`sellBundle_${id}`).value) || 0;
            let sellUnitVal = parseFloat(document.getElementById(`sellUnit_${id}`).value) || 0;

            item.pcs = pcsVal;

            if (changedField === 'pcs' || changedField === 'buyBundle') {
                item.buyBundle = buyBundleVal;
                if (pcsVal > 0) {
                    item.buyUnit = +(buyBundleVal / pcsVal).toFixed(2);
                    document.getElementById(`buyUnit_${id}`).value = item.buyUnit;
                }
            } else if (changedField === 'buyUnit') {
                item.buyUnit = buyUnitVal;
                if (pcsVal > 0) {
                    item.buyBundle = +(buyUnitVal * pcsVal).toFixed(2);
                    document.getElementById(`buyBundle_${id}`).value = item.buyBundle;
                }
            } 
            
            item.sellBundle = sellBundleVal;
            item.sellUnit = sellUnitVal;

            saveToStorage();
        }

        function updateExtraData(id, colName, value) {
            let item = invoiceData.find(p => p.id === id);
            if (!item) return;
            if (!item.extra) item.extra = {};
            item.extra[colName] = value;
            saveToStorage();
        }

        function addColumn() {
            let colName = prompt("أدخل اسم العمود الجديد:");
            if (!colName || colName.trim() === "") return;
            if (invoiceColumns.includes(colName.trim())) {
                alert("هذا العمود موجود مسبقاً!");
                return;
            }
            invoiceColumns.push(colName.trim());
            saveToStorage();
            renderTable(invoiceData);
        }

        function deleteColumn(colIdx) {
            if (colIdx < 6) return;
            invoiceColumns.splice(colIdx, 1);
            saveToStorage();
            renderTable(invoiceData);
        }

        function upsertProduct(prodData) {
            let cleanName = prodData.name.trim();
            if (!cleanName) return;

            if (prodData.pcs > 0 && prodData.buyBundle > 0) {
                prodData.buyUnit = +(prodData.buyBundle / prodData.pcs).toFixed(2);
            }

            let existingIndex = invoiceData.findIndex(p => p.name.trim() === cleanName);
            if (existingIndex !== -1) {
                invoiceData[existingIndex].pcs = prodData.pcs;
                invoiceData[existingIndex].buyBundle = prodData.buyBundle;
                invoiceData[existingIndex].sellBundle = prodData.sellBundle;
                invoiceData[existingIndex].buyUnit = prodData.buyUnit;
                invoiceData[existingIndex].sellUnit = prodData.sellUnit;
            } else {
                invoiceData.push(prodData);
            }
            saveToStorage();
        }

        function addNewProductPrompt() {
            let name = prompt("أدخل اسم المنتج الجديد:");
            if (!name || name.trim() === "") return;
            
            let newItem = {
                id: Date.now(),
                name: name.trim(),
                pcs: 1,
                buyBundle: 0,
                sellBundle: 0,
                buyUnit: 0,
                sellUnit: 0,
                extra: {}
            };
            invoiceColumns.slice(6).forEach(col => { newItem.extra[col] = ''; });

            upsertProduct(newItem);
            renderTable(invoiceData);
        }

        // قراءة ملف الـ PDF بالكامل صفحة بصفحة وترتيب الاحداثيات والنصوص
        async function handlePdfUpload(event) {
            let file = event.target.files[0];
            if (!file) return;

            let overlay = document.getElementById('loadingOverlay');
            let progressText = document.getElementById('progressText');
            overlay.style.display = 'block';

            try {
                let fileReader = new FileReader();
                fileReader.onload = async function() {
                    let typedarray = new Uint8Array(this.result);
                    let pdf = await pdfjsLib.getDocument(typedarray).promise;
                    let fullExtractedText = "";

                    for (let i = 1; i <= pdf.numPages; i++) {
                        progressText.innerText = `جاري قراءة وتحليل الصفحة ${i} من ${pdf.numPages}...`;
                        let page = await pdf.getPage(i);
                        let textContent = await page.getTextContent();
                        
                        // ترتيب العناصر حسب الموقع العمودي والأفقي لضمان دقة قراءة الجداول
                        let items = textContent.items.map(item => ({
                            str: item.str,
                            x: item.transform[4],
                            y: item.transform[5]
                        }));

                        // تجميع النصوص حسب السطور التقريبية
                        items.sort((a, b) => Math.abs(b.y - a.y) > 5 ? b.y - a.y : a.x - b.x);

                        let lastY = null;
                        let lineStr = "";
                        items.forEach(item => {
                            if (lastY === null || Math.abs(item.y - lastY) > 6) {
                                if (lineStr.trim() !== "") fullExtractedText += lineStr + "\n";
                                lineStr = item.str;
                                lastY = item.y;
                            } else {
                                lineStr += " " + item.str;
                            }
                        });
                        if (lineStr.trim() !== "") fullExtractedText += lineStr + "\n";
                    }

                    overlay.style.display = 'none';

                    if (fullExtractedText.trim() !== "") {
                        processExtractedText(fullExtractedText);
                    } else {
                        alert("لم يتم العثور على نصوص واضحة داخل ملف الـ PDF.");
                    }
                };
                fileReader.readAsArrayBuffer(file);
            } catch (err) {
                overlay.style.display = 'none';
                alert("حدث خطأ أثناء قراءة ملف الـ PDF.");
            }
        }

        function openPasteModal() {
            let textInput = prompt("قم بلصق نصوص الفاتورة هنا (كل منتج في سطر مع سعره وعدد القطع):");
            if (textInput && textInput.trim() !== "") {
                processExtractedText(textInput);
            }
        }

        // تحليل النصوص المستخرجة بدقة واستخراج كافة الأرقام والأسماء
        function processExtractedText(text) {
            let lines = text.split('\n');
            let addedCount = 0;
            let updatedCount = 0;

            lines.forEach((line, idx) => {
                let cleanLine = line.trim();
                if (cleanLine.length < 3) return;

                // استخراج الأرقام من السطر
                let numbers = cleanLine.match(/\d+(\.\d+)?/g);
                
                if (numbers && numbers.length >= 1) {
                    let buyPrice = parseFloat(numbers[numbers.length - 1]) || 0;
                    let pcsCount = numbers.length >= 2 ? (parseFloat(numbers[numbers.length - 2]) || 1) : 1;
                    
                    // استخراج اسم المنتج عبر استبعاد الأرقام والرموز
                    let productName = cleanLine.replace(/[\d\.\,\-]+/g, ' ').replace(/\s+/g, ' ').trim();
                    if (productName.length < 2) productName = `منتج فاتورة ${idx + 1}`;

                    let buyUnitCalc = pcsCount > 0 ? +(buyPrice / pcsCount).toFixed(2) : 0;

                    let newItem = {
                        id: Date.now() + idx,
                        name: productName,
                        pcs: (pcsCount > 100 || pcsCount <= 0) ? 1 : pcsCount,
                        buyBundle: buyPrice,
                        sellBundle: +(buyPrice * 1.2).toFixed(2),
                        buyUnit: buyUnitCalc,
                        sellUnit: +(buyUnitCalc * 1.2).toFixed(2),
                        extra: {}
                    };

                    let existing = invoiceData.find(p => p.name.trim() === productName);
                    if (existing) updatedCount++;
                    else addedCount++;

                    upsertProduct(newItem);
                }
            });

            renderTable(invoiceData);
            alert(`تم استخراج وفحص جميع صفحات الـ PDF بنجاح! 📊✨\n- المنتجات المحدثة: ${updatedCount}\n- المنتجات الجديدة المضافة: ${addedCount}\n(تم استخراج أسماء المنتجات، عدد القطع، سعر شراء الطرد، وحساب شراء القطعة تلقائياً لكل الملف).`);
        }

        function handleExcelUpload(event) {
            let file = event.target.files[0];
            if (!file) return;

            let reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let data = new Uint8Array(e.target.result);
                    let workbook = XLSX.read(data, { type: 'array' });
                    let worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    let jsonSheet = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    if (jsonSheet.length > 0) {
                        let headerRow = jsonSheet[0];
                        for(let c = 6; c < headerRow.length; c++) {
                            if(headerRow[c] && !invoiceColumns.includes(headerRow[c])) {
                                invoiceColumns.push(headerRow[c]);
                            }
                        }

                        let updateCount = 0;
                        let addCount = 0;

                        for (let i = 1; i < jsonSheet.length; i++) {
                            let row = jsonSheet[i];
                            if (row && row[0]) {
                                let productName = String(row[0]).trim();
                                let existing = invoiceData.find(p => p.name.trim() === productName);
                                
                                let newItem = {
                                    id: existing ? existing.id : (Date.now() + i),
                                    name: productName,
                                    pcs: parseFloat(row[1]) || 1,
                                    buyBundle: parseFloat(row[2]) || 0,
                                    sellBundle: parseFloat(row[3]) || 0,
                                    buyUnit: parseFloat(row[4]) || 0,
                                    sellUnit: parseFloat(row[5]) || 0,
                                    extra: {}
                                };
                                for(let c = 6; c < invoiceColumns.length; c++) {
                                    newItem.extra[invoiceColumns[c]] = row[c] !== undefined ? row[c] : '';
                                }

                                if (existing) updateCount++;
                                else addCount++;

                                upsertProduct(newItem);
                            }
                        }

                        renderTable(invoiceData);
                        alert(`تمت معالجة ملف الإكسل بنجاح! 🎉\n- تم تحديث المنتجات: ${updateCount}\n- تم إضافة منتجات جديدة: ${addCount}`);
                    }
                } catch (err) {
                    alert("حدث خطأ أثناء قراءة ملف الإكسل.");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function deleteRow(id) {
            invoiceData = invoiceData.filter(p => p.id !== id);
            saveToStorage();
            renderTable(invoiceData);
        }

        function exportToExcel() {
            let worksheetData = [invoiceColumns];
            invoiceData.forEach(item => {
                let row = [item.name, item.pcs, item.buyBundle, item.sellBundle, item.buyUnit, item.sellUnit];
                invoiceColumns.slice(6).forEach(col => {
                    row.push(item.extra && item.extra[col] !== undefined ? item.extra[col] : '');
                });
                worksheetData.push(row);
            });

            let ws = XLSX.utils.aoa_to_sheet(worksheetData);
            let wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "الفاتورة");
            XLSX.writeFile(wb, "Bim_Al_Radwan_Export.xlsx");
        }

        function filterTable() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = invoiceData.filter(item => item.name.toLowerCase().includes(query));
            renderTable(filtered);
        }

        renderTable(invoiceData);
    </script>
</body>
</html>
