<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>فاتورة بيم الرضوان - تحليل الأسعار والتعديل</title>
    <style>
        @page {
            size: A4;
            margin: 10mm;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #1f2937;
            background: #f3f4f6;
            margin: 0;
            padding: 20px;
            font-size: 11pt;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #4f46e5;
            padding-bottom: 10px;
        }
        .header h1 {
            margin: 0;
            color: #4f46e5;
            font-size: 20pt;
        }
        .header p {
            margin: 5px 0 0;
            color: #6b7280;
            font-size: 10pt;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            gap: 10px;
        }
        .controls input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 11pt;
        }
        .btn-print {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-print:hover {
            opacity: 0.9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #d1d5db;
            padding: 8px 10px;
            text-align: center;
        }
        th {
            background-color: #4f46e5;
            color: white;
            font-weight: bold;
            font-size: 10.5pt;
        }
        td input {
            width: 90%;
            border: none;
            background: transparent;
            text-align: center;
            font-size: 11pt;
            font-family: inherit;
        }
        td input:focus {
            background: #eef2ff;
            outline: 1px solid #4f46e5;
            border-radius: 4px;
        }
        td:nth-child(2) input {
            text-align: right;
        }
        tr:nth-child(even) {
            background-color: #f9fafb;
        }
        .total-row {
            font-weight: bold;
            background-color: #eef2ff !important;
        }
        .footer {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 10pt;
            color: #6b7280;
        }
        @media print {
            body {
                background: #ffffff;
                padding: 0;
            }
            .container {
                box-shadow: none;
                padding: 0;
            }
            .controls, .no-print {
                display: none;
            }
            td input {
                border: none !important;
                background: transparent !important;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>سوبر ماركت بيم الرضوان</h1>
            <p>تقرير تفصيلي بأسعار الطرود والقطع المستخرجة من الفاتورة (قابل للتعديل والبحث)</p>
        </div>

        <div class="controls">
            <input type="text" id="searchInput" placeholder="ابحث عن منتج بالاسم..." oninput="filterTable()">
            <button class="btn-print" onclick="window.print()">🖨️ طباعة الورقة</button>
        </div>

        <table id="invoiceTable">
            <thead>
                <tr>
                    <th style="width: 8%;">الرقم</th>
                    <th style="width: 35%;">اسم المنتج / الوصف</th>
                    <th style="width: 15%;">عدد القطع</th>
                    <th style="width: 21%;">سعر الطرد الإجمالي (₺)</th>
                    <th style="width: 21%;">سعر القطعة الواحدة (₺)</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- الصفوف يتم توليدها ديناميكياً لتفعيل الحساب التلقائي -->
            </tbody>
            <tfoot>
                <tr class="total-row">
                    <td colspan="3" style="text-align: left;">المجموع الكلي:</td>
                    <td colspan="2" id="grandTotalCell">28,980.00 ₺</td>
                </tr>
            </tfoot>
        </table>

        <div class="footer">
            <div>تاريخ الإصدار: 2026-09-09</div>
            <div>تم الاستخراج والتنظيم بواسطة نظام بيم الرضوان</div>
        </div>
    </div>

    <script>
        // بيانات المنتجات الأصلية مستخرجة من الفاتورة
        let invoiceData = [
            { id: 1, name: "رز بيليك بر حبة طويلة 900 غرام", qty: 20, bundlePrice: 1135.00 },
            { id: 2, name: "رز اسكندر 900 غرام", qty: 20, bundlePrice: 1510.00 },
            { id: 3, name: "ملوخية مصرية 12 قطعة وزن 350 غرام", qty: 12, bundlePrice: 1300.00 },
            { id: 4, name: "منتج متنوع / طرد", qty: 10, bundlePrice: 100.00 },
            { id: 5, name: "مطبورة صلصة", qty: 72, bundlePrice: 100.00 },
            { id: 6, name: "معجون محل 7 كغ", qty: 5, bundlePrice: 430.00 },
            { id: 7, name: "محمود 3*1 12 قطعة mahnut", qty: 12, bundlePrice: 1900.00 },
            { id: 8, name: "طون التونسنا 24 قطعة", qty: 24, bundlePrice: 1375.00 },
            { id: 9, name: "رز احمدي 900 غرام", qty: 20, bundlePrice: 1800.00 },
            { id: 10, name: "كاسات شاي تركية 12 قطعة", qty: 12, bundlePrice: 435.00 },
            { id: 11, name: "سنة بيتزا 4.5 لتر 4 قطع", qty: 4, bundlePrice: 1800.00 },
            { id: 12, name: "قلب جوز 5 كغ", qty: 5, bundlePrice: 380.00 },
            { id: 13, name: "معجون محل 1200 غرام عدد 4 قطع", qty: 4, bundlePrice: 380.00 },
            { id: 14, name: "فول علب 200 غرام 24 قطعة", qty: 24, bundlePrice: 400.00 },
            { id: 15, name: "ملح 8 كغ tuz", qty: 30, bundlePrice: 42.00 }
        ];

        function renderTable(dataToRender) {
            let tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            dataToRender.forEach((item, index) => {
                let unitPrice = item.qty > 0 ? (item.bundlePrice / item.qty).toFixed(2) : 0;
                
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.id}</td>
                    <td><input type="text" value="${item.name}" onchange="updateData(${item.id}, 'name', this.value)"></td>
                    <td><input type="number" value="${item.qty}" oninput="updateData(${item.id}, 'qty', this.value)"></td>
                    <td><input type="number" step="0.01" value="${item.bundlePrice}" oninput="updateData(${item.id}, 'bundlePrice', this.value)"></td>
                    <td id="unit_${item.id}" style="font-weight: 600; color: #059669;">${unitPrice} ₺</td>
                `;
                tbody.appendChild(tr);
            });
            updateGrandTotal();
        }

        function updateData(id, field, value) {
            let item = invoiceData.find(p => p.id === id);
            if (!item) return;

            if (field === 'name') {
                item.name = value;
            } else if (field === 'qty') {
                item.qty = parseFloat(value) || 0;
            } else if (field === 'bundlePrice') {
                item.bundlePrice = parseFloat(value) || 0;
            }

            // تحديث سعر القطعة الواحدة فوراً في نفس السطر دون إعادة تحميل الجدول بالكامل لمنع فقدان التركيز
            let unitPrice = item.qty > 0 ? (item.bundlePrice / item.qty).toFixed(2) : 0;
            document.getElementById(`unit_${id}`).innerText = unitPrice + ' ₺';
            updateGrandTotal();
        }

        function updateGrandTotal() {
            let total = invoiceData.reduce((sum, item) => sum + (parseFloat(item.bundlePrice) || 0), 0);
            document.getElementById('grandTotalCell').innerText = total.toFixed(2) + ' ₺';
        }

        function filterTable() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = invoiceData.filter(item => item.name.toLowerCase().includes(query));
            renderTable(filtered);
        }

        // التهيئة الأولية للجدول
        renderTable(invoiceData);
    </script>
</body>
</html>
