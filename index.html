<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>فاتورة بيم الرضوان - بدون المجموع</title>
    <style>
        @page {
            size: A4;
            margin: 10mm;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #1f2937;
            background: #f3f4f6;
            margin: 0;
            padding: 20px;
            font-size: 11pt;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #4f46e5;
            padding-bottom: 10px;
        }
        .header h1 {
            margin: 0;
            color: #4f46e5;
            font-size: 20pt;
        }
        .header p {
            margin: 5px 0 0;
            color: #6b7280;
            font-size: 10pt;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            margin-bottom: 15px;
            gap: 10px;
        }
        .controls input, .controls button {
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 10.5pt;
        }
        .controls input {
            flex: 1;
            min-width: 200px;
        }
        .btn {
            background-color: #4f46e5;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn-success { background-color: #059669; }
        .btn-danger { background-color: #dc2626; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #d1d5db;
            padding: 8px 10px;
            text-align: center;
        }
        th {
            background-color: #4f46e5;
            color: white;
            font-weight: bold;
            font-size: 10.5pt;
            position: relative;
        }
        th input {
            background: transparent;
            border: 1px dashed white;
            color: white;
            text-align: center;
            font-weight: bold;
            width: 80%;
        }
        td input {
            width: 90%;
            border: none;
            background: transparent;
            text-align: center;
            font-size: 11pt;
            font-family: inherit;
        }
        td input:focus {
            background: #eef2ff;
            outline: 1px solid #4f46e5;
            border-radius: 4px;
        }
        td:nth-child(2) input {
            text-align: right;
        }
        tr:nth-child(even) {
            background-color: #f9fafb;
        }
        .footer {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 10pt;
            color: #6b7280;
        }
        @media print {
            body {
                background: #ffffff;
                padding: 0;
            }
            .container {
                box-shadow: none;
                padding: 0;
            }
            .controls, .no-print, .btn-danger, .action-col {
                display: none !important;
            }
            td input {
                border: none !important;
                background: transparent !important;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>سوبر ماركت بيم الرضوان</h1>
            <p>تقرير الفاتورة المطور - بدون سطر المجموع الكلي</p>
        </div>

        <div class="controls">
            <input type="text" id="searchInput" placeholder="ابحث عن منتج بالاسم..." oninput="filterTable()">
            <button class="btn btn-success" onclick="addRow()">➕ إضافة صف جديد</button>
            <button class="btn" onclick="addColumn()">➕ إضافة عمود جديد</button>
            <button class="btn" onclick="window.print()" style="background-color: #1f2937;">🖨️ طباعة الورقة</button>
        </div>

        <div style="overflow-x: auto;">
            <table id="invoiceTable">
                <thead>
                    <tr id="tableHeaderRow">
                        <th style="width: 6%;">الرقم</th>
                        <th style="width: 28%;">اسم المنتج / الوصف</th>
                        <th style="width: 12%;">عدد القطع</th>
                        <th style="width: 18%;">سعر الطرد (₺)</th>
                        <th style="width: 18%;">سعر القطعة (₺)</th>
                        <th class="action-col" style="width: 8%;">إجراء</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- الصفوف تتولد ديناميكياً -->
                </tbody>
            </table>
        </div>

        <div class="footer">
            <div>تاريخ الإصدار: 2026-09-09</div>
            <div>تم الاستخراج والتنظيم بواسطة نظام بيم الرضوان</div>
        </div>
    </div>

    <script>
        let dynamicColumns = [];

        let invoiceData = [
            { id: 1, name: "رز بيليك بر حبة طويلة 900 غرام", qty: 20, bundlePrice: 1135.00, extraValues: {} },
            { id: 2, name: "رز اسكندر 900 غرام", qty: 20, bundlePrice: 1510.00, extraValues: {} },
            { id: 3, name: "ملوخية مصرية 12 قطعة وزن 350 غرام", qty: 12, bundlePrice: 1300.00, extraValues: {} },
            { id: 4, name: "منتج متنوع / طرد", qty: 10, bundlePrice: 100.00, extraValues: {} },
            { id: 5, name: "مطبورة صلصة", qty: 72, bundlePrice: 100.00, extraValues: {} },
            { id: 6, name: "معجون محل 7 كغ", qty: 5, bundlePrice: 430.00, extraValues: {} },
            { id: 7, name: "محمود 3*1 12 قطعة mahnut", qty: 12, bundlePrice: 1900.00, extraValues: {} },
            { id: 8, name: "طون التونسنا 24 قطعة", qty: 24, bundlePrice: 1375.00, extraValues: {} },
            { id: 9, name: "رز احمدي 900 غرام", qty: 20, bundlePrice: 1800.00, extraValues: {} },
            { id: 10, name: "كاسات شاي تركية 12 قطعة", qty: 12, bundlePrice: 435.00, extraValues: {} },
            { id: 11, name: "سنة بيتزا 4.5 لتر 4 قطع", qty: 4, bundlePrice: 1800.00, extraValues: {} },
            { id: 12, name: "قلب جوز 5 كغ", qty: 5, bundlePrice: 380.00, extraValues: {} },
            { id: 13, name: "معجون محل 1200 غرام عدد 4 قطع", qty: 4, bundlePrice: 380.00, extraValues: {} },
            { id: 14, name: "فول علب 200 غرام 24 قطعة", qty: 24, bundlePrice: 400.00, extraValues: {} },
            { id: 15, name: "ملح 8 كغ tuz", qty: 30, bundlePrice: 42.00, extraValues: {} }
        ];

        function renderTable(dataToRender) {
            let headerRow = document.getElementById('tableHeaderRow');
            let baseHeaderHTML = `
                <th style="width: 6%;">الرقم</th>
                <th style="width: 28%;">اسم المنتج / الوصف</th>
                <th style="width: 12%;">عدد القطع</th>
                <th style="width: 18%;">سعر الطرد (₺)</th>
                <th style="width: 18%;">سعر القطعة (₺)</th>
            `;
            
            dynamicColumns.forEach((colName, colIdx) => {
                baseHeaderHTML += `<th><input type="text" value="${colName}" onchange="updateColumnName(${colIdx}, this.value)"> <button onclick="deleteColumn(${colIdx})" style="background:none;border:none;color:white;cursor:pointer;">❌</button></th>`;
            });
            baseHeaderHTML += `<th class="action-col" style="width: 8%;">إجراء</th>`;
            headerRow.innerHTML = baseHeaderHTML;

            let tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            dataToRender.forEach((item) => {
                let unitPrice = item.qty > 0 ? (item.bundlePrice / item.qty).toFixed(2) : 0;
                
                let tr = document.createElement('tr');
                let rowHTML = `
                    <td>${item.id}</td>
                    <td><input type="text" value="${item.name}" onchange="updateData(${item.id}, 'name', this.value)"></td>
                    <td><input type="number" value="${item.qty}" oninput="updateData(${item.id}, 'qty', this.value)"></td>
                    <td><input type="number" step="0.01" value="${item.bundlePrice}" oninput="updateData(${item.id}, 'bundlePrice', this.value)"></td>
                    <td id="unit_${item.id}" style="font-weight: 600; color: #059669;">${unitPrice} ₺</td>
                `;

                dynamicColumns.forEach((colName, colIdx) => {
                    let val = (item.extraValues && item.extraValues[colIdx]) || '';
                    rowHTML += `<td><input type="text" value="${val}" oninput="updateExtraValue(${item.id}, ${colIdx}, this.value)"></td>`;
                });

                rowHTML += `<td class="action-col"><button class="btn btn-danger" style="padding: 4px 8px; font-size: 10px;" onclick="deleteRow(${item.id})">حذف</button></td>`;
                tr.innerHTML = rowHTML;
                tbody.appendChild(tr);
            });
        }

        function updateData(id, field, value) {
            let item = invoiceData.find(p => p.id === id);
            if (!item) return;

            if (field === 'name') {
                item.name = value;
            } else if (field === 'qty') {
                item.qty = parseFloat(value) || 0;
            } else if (field === 'bundlePrice') {
                item.bundlePrice = parseFloat(value) || 0;
            }

            let unitPrice = item.qty > 0 ? (item.bundlePrice / item.qty).toFixed(2) : 0;
            let unitElem = document.getElementById(`unit_${id}`);
            if(unitElem) unitElem.innerText = unitPrice + ' ₺';
        }

        function updateExtraValue(id, colIdx, value) {
            let item = invoiceData.find(p => p.id === id);
            if (!item) return;
            if (!item.extraValues) item.extraValues = {};
            item.extraValues[colIdx] = value;
        }

        function addRow() {
            let newId = invoiceData.length > 0 ? Math.max(...invoiceData.map(p => p.id)) + 1 : 1;
            let newProduct = {
                id: newId,
                name: "منتج جديد",
                qty: 1,
                bundlePrice: 0,
                extraValues: {}
            };
            invoiceData.push(newProduct);
            renderTable(invoiceData);
        }

        function deleteRow(id) {
            invoiceData = invoiceData.filter(p => p.id !== id);
            renderTable(invoiceData);
        }

        function addColumn() {
            let colName = prompt("أدخل اسم العمود الجديد (مثال: الملاحظات، المورد، الموقع):", "عمود جديد");
            if (colName && colName.trim() !== "") {
                dynamicColumns.push(colName.trim());
                renderTable(invoiceData);
            }
        }

        function updateColumnName(colIdx, newName) {
            if (newName && newName.trim() !== "") {
                dynamicColumns[colIdx] = newName.trim();
            }
        }

        function deleteColumn(colIdx) {
            if (confirm("هل أنت متأكد من حذف هذا العمود بكل بياناته؟")) {
                dynamicColumns.splice(colIdx, 1);
                invoiceData.forEach(item => {
                    if (item.extraValues) {
                        delete item.extraValues[colIdx];
                    }
                });
                renderTable(invoiceData);
            }
        }

        function filterTable() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = invoiceData.filter(item => item.name.toLowerCase().includes(query));
            renderTable(filtered);
        }

        renderTable(invoiceData);
    </script>
</body>
</html>
