<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>فاتورة بيم الرضوان - قراءة ملفات الإكسل مباشرة</title>
    <!-- استدعاء مكتبة قراءة ملفات الإكسل من الإنترنت لتسهيل الرفع -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @page {
            size: A4;
            margin: 10mm;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #1f2937;
            background: #f3f4f6;
            margin: 0;
            padding: 20px;
            font-size: 11pt;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #4f46e5;
            padding-bottom: 10px;
        }
        .header h1 {
            margin: 0;
            color: #4f46e5;
            font-size: 20pt;
        }
        .header p {
            margin: 5px 0 0;
            color: #6b7280;
            font-size: 10pt;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            margin-bottom: 15px;
            gap: 10px;
        }
        .controls input[type="text"], .controls label.btn-upload {
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 10.5pt;
        }
        .controls input[type="text"] {
            flex: 1;
            min-width: 200px;
        }
        .btn {
            background-color: #4f46e5;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 10.5pt;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn-success { background-color: #059669; }
        .btn-danger { background-color: #dc2626; }
        .btn-upload {
            background-color: #d97706;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #d1d5db;
            padding: 8px 10px;
            text-align: center;
        }
        th {
            background-color: #4f46e5;
            color: white;
            font-weight: bold;
            font-size: 10.5pt;
            position: relative;
        }
        th input {
            background: transparent;
            border: 1px dashed white;
            color: white;
            text-align: center;
            font-weight: bold;
            width: 80%;
        }
        td input {
            width: 90%;
            border: none;
            background: transparent;
            text-align: center;
            font-size: 11pt;
            font-family: inherit;
        }
        td input:focus {
            background: #eef2ff;
            outline: 1px solid #4f46e5;
            border-radius: 4px;
        }
        td:nth-child(2) input {
            text-align: right;
        }
        tr:nth-child(even) {
            background-color: #f9fafb;
        }
        .footer {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 10pt;
            color: #6b7280;
        }
        @media print {
            body {
                background: #ffffff;
                padding: 0;
            }
            .container {
                box-shadow: none;
                padding: 0;
            }
            .controls, .no-print, .btn-danger, .action-col {
                display: none !important;
            }
            td input {
                border: none !important;
                background: transparent !important;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>سوبر ماركت بيم الرضوان</h1>
            <p>نظام قراءة ملفات الإكسل و إدارة الفواتير</p>
        </div>

        <div class="controls">
            <input type="text" id="searchInput" placeholder="ابحث عن منتج بالاسم..." oninput="filterTable()">
            <label class="btn btn-upload">
                📂 رفع ملف إكسل <input type="file" id="excelFileInput" accept=".xlsx, .xls" style="display: none;" onchange="handleExcelUpload(event)">
            </label>
            <button class="btn btn-success" onclick="addRow()">➕ إضافة صف</button>
            <button class="btn" onclick="addColumn()">➕ إضافة عمود</button>
            <button class="btn" onclick="window.print()" style="background-color: #1f2937;">🖨️ طباعة</button>
        </div>

        <div style="overflow-x: auto;">
            <table id="invoiceTable">
                <thead>
                    <tr id="tableHeaderRow">
                        <th style="width: 6%;">الرقم</th>
                        <th style="width: 28%;">اسم المنتج / الوصف</th>
                        <th style="width: 12%;">عدد القطع</th>
                        <th style="width: 18%;">سعر الطرد (₺)</th>
                        <th style="width: 18%;">سعر القطعة (₺)</th>
                        <th class="action-col" style="width: 8%;">إجراء</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- الصفوف تتولد ديناميكياً -->
                </tbody>
            </table>
        </div>

        <div class="footer">
            <div>تاريخ الإصدار: 2026-09-09</div>
            <div>تم الاستخراج والتنظيم بواسطة نظام بيم الرضوان</div>
        </div>
    </div>

    <script>
        let dynamicColumns = [];

        let invoiceData = [
            { id: 1, name: "معارم معطرة صغيرة سائل", qty: 2, bundlePrice: 520.00, extraValues: {} },
            { id: 2, name: "شامبو هيرابي 3 لتر 4 قطع", qty: 2, bundlePrice: 1290.00, extraValues: {} },
            { id: 3, name: "بلسم هيرابي 3 لتر 4 قطع", qty: 1, bundlePrice: 645.00, extraValues: {} },
            { id: 4, name: "حامو هيرابي 3 لتر 4 قطع", qty: 1, bundlePrice: 645.00, extraValues: {} },
            { id: 5, name: "سنة البيرة الحبوب 800 مل 12 قطعة", qty: 1, bundlePrice: 400.00, extraValues: {} },
            { id: 6, name: "حامو ملتان 15 قطعة", qty: 2, bundlePrice: 1550.00, extraValues: {} },
            { id: 7, name: "طون التونسنا 24 قطعة", qty: 1, bundlePrice: 1385.00, extraValues: {} },
            { id: 8, name: "القارة معكرونة، مكرونة، هامرية، هيمبرية 20 قطعة 500 غرام", qty: 1, bundlePrice: 475.00, extraValues: {} },
            { id: 9, name: "كروصان 24/7 عدد 24 قطعة", qty: 1, bundlePrice: 160.00, extraValues: {} },
            { id: 10, name: "واصل", qty: 1, bundlePrice: 260.00, extraValues: {} },
            { id: 11, name: "فتاحاعات دولاب جر 50 قطعة", qty: 1, bundlePrice: 300.00, extraValues: {} },
            { id: 12, name: "بودرة أطفال علبة هينس 12 قطعة", qty: 1, bundlePrice: 410.00, extraValues: {} },
            { id: 13, name: "كاتشب 12 قطعة", qty: 1, bundlePrice: 2800.00, extraValues: {} },
            { id: 14, name: "فاصوليا مقادة 900 غرام 12 قطعة", qty: 1, bundlePrice: 700.00, extraValues: {} },
            { id: 15, name: "جبنة حمرا 100 قطعة", qty: 1, bundlePrice: 950.00, extraValues: {} },
            { id: 16, name: "بذور دور 750 غرام 12 قطعة", qty: 1, bundlePrice: 5000.00, extraValues: {} },
            { id: 17, name: "شاي احمدي 400 غرام 24 قطعة", qty: 24, bundlePrice: 198.75, extraValues: {} },
            { id: 18, name: "شاي حورجة 400 غرام", qty: 16, bundlePrice: 100.00, extraValues: {} },
            { id: 19, name: "مربى بور 400 غرام", qty: 2, bundlePrice: 4150.00, extraValues: {} },
            { id: 20, name: "شاي نادي احمدي 900 غرام", qty: 1, bundlePrice: 100.00, extraValues: {} },
            { id: 21, name: "ميم مكعب أصلي 6 قطع", qty: 1, bundlePrice: 480.00, extraValues: {} },
            { id: 22, name: "شاي هاي بيست 900 غرام 20 قطعة", qty: 1, bundlePrice: 1875.00, extraValues: {} },
            { id: 23, name: "حمص جيزل 12 غرام 900 قطعة", qty: 1, bundlePrice: 130.00, extraValues: {} },
            { id: 24, name: "طون الهيل 48 قطعة", qty: 1, bundlePrice: 30.00, extraValues: {} }
        ];

        function renderTable(dataToRender) {
            let headerRow = document.getElementById('tableHeaderRow');
            let baseHeaderHTML = `
                <th style="width: 6%;">الرقم</th>
                <th style="width: 28%;">اسم المنتج / الوصف</th>
                <th style="width: 12%;">عدد القطع</th>
                <th style="width: 18%;">سعر الطرد (₺)</th>
                <th style="width: 18%;">سعر القطعة (₺)</th>
            `;
            
            dynamicColumns.forEach((colName, colIdx) => {
                baseHeaderHTML += `<th><input type="text" value="${colName}" onchange="updateColumnName(${colIdx}, this.value)"> <button onclick="deleteColumn(${colIdx})" style="background:none;border:none;color:white;cursor:pointer;">❌</button></th>`;
            });
            baseHeaderHTML += `<th class="action-col" style="width: 8%;">إجراء</th>`;
            headerRow.innerHTML = baseHeaderHTML;

            let tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            dataToRender.forEach((item) => {
                let unitPrice = item.qty > 0 ? (item.bundlePrice / item.qty).toFixed(2) : 0;
                
                let tr = document.createElement('tr');
                let rowHTML = `
                    <td>${item.id}</td>
                    <td><input type="text" value="${item.name}" onchange="updateData(${item.id}, 'name', this.value)"></td>
                    <td><input type="number" value="${item.qty}" oninput="updateData(${item.id}, 'qty', this.value)"></td>
                    <td><input type="number" step="0.01" value="${item.bundlePrice}" oninput="updateData(${item.id}, 'bundlePrice', this.value)"></td>
                    <td id="unit_${item.id}" style="font-weight: 600; color: #059669;">${unitPrice} ₺</td>
                `;

                dynamicColumns.forEach((colName, colIdx) => {
                    let val = (item.extraValues && item.extraValues[colIdx]) || '';
                    rowHTML += `<td><input type="text" value="${val}" oninput="updateExtraValue(${item.id}, ${colIdx}, this.value)"></td>`;
                });

                rowHTML += `<td class="action-col"><button class="btn btn-danger" style="padding: 4px 8px; font-size: 10px;" onclick="deleteRow(${item.id})">حذف</button></td>`;
                tr.innerHTML = rowHTML;
                tbody.appendChild(tr);
            });
        }

        // قراءة ملف الإكسل الحقيقي (.xlsx / .xls) عبر المتصفح مباشرة
        function handleExcelUpload(event) {
            let file = event.target.files[0];
            if (!file) return;

            let reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let data = new Uint8Array(e.target.result);
                    let workbook = XLSX.read(data, { type: 'array' });
                    let firstSheetName = workbook.SheetNames[0];
                    let worksheet = workbook.Sheets[firstSheetName];
                    let jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    let newItems = [];
                    let idCounter = 1;

                    // تخطي صف العناوين البدء من السطر الثاني (index 1)
                    for (let i = 1; i < jsonRows.length; i++) {
                        let row = jsonRows[i];
                        if (row && row.length >= 3 && row[0]) {
                            newItems.push({
                                id: idCounter++,
                                name: String(row[0]).trim(),
                                qty: parseFloat(row[1]) || 1,
                                bundlePrice: parseFloat(row[2]) || 0,
                                extraValues: {}
                            });
                        }
                    }

                    if (newItems.length > 0) {
                        invoiceData = newItems;
                        renderTable(invoiceData);
                        alert("تم رفع وتحديث بيانات الإكسل بنجاح!");
                    } else {
                        alert("لم يتم العثور على بيانات كافية. تأكد أن الأعمدة مرتبة هكذا: (اسم المنتج في العمود الأول، الكمية في الثاني، السعر في الثالث).");
                    }
                } catch (error) {
                    alert("حدث خطأ أثناء قراءة ملف الإكسل. تأكد من صحة الملف.");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function updateData(id, field, value) {
            let item = invoiceData.find(p => p.id === id);
            if (!item) return;

            if (field === 'name') {
                item.name = value;
            } else if (field === 'qty') {
                item.qty = parseFloat(value) || 0;
            } else if (field === 'bundlePrice') {
                item.bundlePrice = parseFloat(value) || 0;
            }

            let unitPrice = item.qty > 0 ? (item.bundlePrice / item.qty).toFixed(2) : 0;
            let unitElem = document.getElementById(`unit_${id}`);
            if(unitElem) unitElem.innerText = unitPrice + ' ₺';
        }

        function updateExtraValue(id, colIdx, value) {
            let item = invoiceData.find(p => p.id === id);
            if (!item) return;
            if (!item.extraValues) item.extraValues = {};
            item.extraValues[colIdx] = value;
        }

        function addRow() {
            let newId = invoiceData.length > 0 ? Math.max(...invoiceData.map(p => p.id)) + 1 : 1;
            let newProduct = {
                id: newId,
                name: "منتج جديد",
                qty: 1,
                bundlePrice: 0,
                extraValues: {}
            };
            invoiceData.push(newProduct);
            renderTable(invoiceData);
        }

        function deleteRow(id) {
            invoiceData = invoiceData.filter(p => p.id !== id);
            renderTable(invoiceData);
        }

        function addColumn() {
            let colName = prompt("أدخل اسم العمود الجديد:", "ملاحظات");
            if (colName && colName.trim() !== "") {
                dynamicColumns.push(colName.trim());
                renderTable(invoiceData);
            }
        }

        function updateColumnName(colIdx, newName) {
            if (newName && newName.trim() !== "") {
                dynamicColumns[colIdx] = newName.trim();
            }
        }

        function deleteColumn(colIdx) {
            if (confirm("هل أنت متأكد من حذف هذا العمود؟")) {
                dynamicColumns.splice(colIdx, 1);
                invoiceData.forEach(item => {
                    if (item.extraValues) {
                        delete item.extraValues[colIdx];
                    }
                });
                renderTable(invoiceData);
            }
        }

        function filterTable() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = invoiceData.filter(item => item.name.toLowerCase().includes(query));
            renderTable(filtered);
        }

        renderTable(invoiceData);
    </script>
</body>
</html>
